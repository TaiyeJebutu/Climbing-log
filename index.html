<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2433">
<title>Route log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#1C2433; --muted:#5E6878; --soft:#AEB6C2; --line:#D5DAD3; --dot:rgba(28,36,51,.10);
  --focus:#2E9CCA; --danger:#C0392B; --ok:#2E8B57; --warn:#B7791F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A23; --surface:#1E2530; --ink:#EEF0EC; --muted:#9AA3B2; --soft:#4A5466; --line:#2C3442; --dot:rgba(238,240,236,.07);
    --danger:#E8735F; --ok:#5CC98A; --warn:#E0A84A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A23; --surface:#1E2530; --ink:#EEF0EC; --muted:#9AA3B2; --soft:#4A5466; --line:#2C3442; --dot:rgba(238,240,236,.07);
  --danger:#E8735F; --ok:#5CC98A; --warn:#E0A84A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--dot) 2px, transparent 2.5px);
  background-size:30px 30px; background-position:15px 15px;
  font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 18px 48px}
h1{font-size:2rem; font-weight:800; letter-spacing:-.02em; margin:0}
h2{font-size:1.45rem; font-weight:800; letter-spacing:-.01em; margin:0}
h3{font-size:1.05rem; font-weight:600; margin:0 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

header .title{display:flex; align-items:baseline; justify-content:space-between; gap:12px}
.topbar{display:flex; align-items:center; gap:10px; margin-top:12px}
.topbar select{flex:1; font-weight:600}
.sync{font-size:.85rem; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap}
.sync i{width:9px; height:9px; border-radius:50%; background:var(--ok); display:inline-block}
.sync.pending i{background:var(--warn)}
.sync.offline i{background:var(--soft)}
.seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; margin:14px 0 20px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:999px; font-weight:600; color:var(--muted)}
.seg button[aria-selected="true"], .seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.seg.inner{margin:0 0 14px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px}
.panel + .panel{margin-top:16px}
.section-title{margin:28px 4px 12px; font-size:1.3rem}
.btn{display:inline-block; border:1.5px solid var(--ink); background:transparent; border-radius:12px; padding:10px 16px; font-weight:600; text-align:center; cursor:pointer}
.btn.primary{background:var(--ink); color:var(--bg)}
.btn.danger{border-color:var(--danger); color:var(--danger)}
.btn.small{padding:6px 12px; font-size:.92rem; border-radius:10px}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btns{display:flex; flex-wrap:wrap; gap:10px}
.back{border:0; background:transparent; padding:4px 0; font-weight:600; color:var(--muted); margin-bottom:12px}

.field{display:block; font-weight:600; margin:0 0 18px}
.field > span{display:block; margin-bottom:8px}
input[type=text], input[type=date], input[type=number], select{
  width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg);
}
.inline{display:flex; gap:8px; margin-top:8px; align-items:center}
.inline input[type=text]{flex:1}

.note{margin-top:12px; min-height:1.4em; font-size:.95rem}
.note.err{color:var(--danger)}
.note.good{color:var(--ok)}

.chip{display:inline-grid; place-items:center; min-width:48px; height:40px; padding:0 8px; flex-shrink:0;
  background:var(--hc); color:var(--hf); text-shadow:var(--ts,none); font-weight:800;
  border-radius:46% 54% 41% 59% / 55% 43% 57% 45%;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.08)}
.chip.big{min-width:74px; height:62px; font-size:1.4rem}
.chip.tiny{min-width:26px; height:20px; padding:0; font-size:0; vertical-align:-4px}
.grades{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px}
.grades button{border:1.5px solid var(--line); background:var(--bg); border-radius:12px; padding:9px 0; font-weight:700}
.grades button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.swatches{display:flex; flex-wrap:wrap; gap:12px}
.swatch{border:0; background:transparent; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.85rem; font-weight:600; width:66px; text-align:center; line-height:1.2}
.swatch i{display:block; width:48px; height:42px; background:var(--hc); border-radius:46% 54% 41% 59% / 55% 43% 57% 45%;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.1)}
.swatch[aria-pressed="true"] i{outline:3px solid var(--ink); outline-offset:3px}
.swatch.add i{background:transparent; box-shadow:none; border:2px dashed var(--muted); display:grid; place-items:center; font-style:normal; font-size:1.4rem; color:var(--muted)}
.editor{margin-top:14px; padding:14px; border:1.5px solid var(--line); border-radius:14px; background:var(--bg)}
.editor .shades{display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 12px; align-items:center}
.editor .shade{display:flex; align-items:center; gap:4px}
.editor input[type=color]{width:52px; height:44px; padding:2px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer}

.filters{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0 4px}
.filters select{padding:8px 10px; font-size:.92rem}
@media (max-width:560px){ .filters{grid-template-columns:1fr 1fr} }
.loc{margin:20px 0 6px; font-weight:600; color:var(--muted); font-size:.95rem}
.routes{list-style:none; margin:0; padding:0}
.routes li + li{border-top:1px solid var(--line)}
.rrow{width:100%; display:flex; align-items:center; gap:14px; border:0; background:transparent; padding:10px 2px; text-align:left}
.rrow .t{flex:1; min-width:0}
.rrow .t strong{display:block; font-weight:600}
.no{color:var(--muted); font-weight:600}
.st{font-size:.92rem; font-weight:600; text-align:right}
.st.none{color:var(--muted); font-weight:400}

.route-head{display:flex; gap:16px; align-items:center; justify-content:space-between}
.route-head .who{display:flex; gap:16px; align-items:center}
.counter{display:grid; grid-template-columns:52px 1fr 88px; gap:8px; align-items:stretch}
.counter button{border:1.5px solid var(--ink); background:transparent; border-radius:12px; font-weight:800; font-size:1.2rem}
.counter .plus{background:var(--ink); color:var(--bg)}
.counter input{text-align:center; font-size:1.3rem; font-weight:800}
.check{display:flex; align-items:center; gap:10px; margin-top:14px; font-weight:600}
.check input{width:22px; height:22px; accent-color:var(--ink)}
.visits{list-style:none; margin:0; padding:0}
.visits li{display:flex; align-items:center; gap:10px; border-top:1px solid var(--line)}
.visits li:first-child{border-top:0}
.visits .v{flex:1; border:0; background:transparent; text-align:left; padding:10px 2px; display:flex; justify-content:space-between; gap:10px}
.visits .v[aria-current="true"]{font-weight:700}
.badge{display:inline-block; font-size:.8rem; font-weight:700; padding:1px 8px; border-radius:99px; background:var(--ink); color:var(--bg)}
.x{border:0; background:transparent; color:var(--muted); padding:6px 8px; border-radius:8px; font-size:.9rem}
.x.armed{color:var(--danger); font-weight:600}

.confirm{border:2px solid var(--ink)}
.confirm ul{margin:8px 0 14px; padding-left:20px}
.empty{text-align:center; padding:28px 14px}
.empty p{margin-bottom:14px}
.filebtn input{position:absolute; width:1px; height:1px; opacity:0}
.filebtn:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.list{list-style:none; margin:0; padding:0}
.list li{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.linkbox{font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:.85rem; background:var(--bg); border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; word-break:break-all; margin:8px 0 12px}
.center{max-width:460px; margin:40px auto 0}
.google{display:inline-flex; align-items:center; gap:10px}

.periods{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.periods button{border:1.5px solid var(--line); background:var(--bg); border-radius:10px; padding:7px 4px; font-weight:600; font-size:.9rem}
.periods button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.range{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.range label{font-weight:600; font-size:.9rem}
.big-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px}
.big-stats b{display:block; font-size:1.5rem; font-weight:800; line-height:1.15}
.bars .row{display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:10px; margin:5px 0}
.bars.wide .row{grid-template-columns:minmax(80px,32%) 1fr auto}
.bars.wide .lab{text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bars .lab{text-align:right; font-weight:600; font-size:.9rem}
.bars .val{font-size:.88rem; color:var(--muted); min-width:64px; text-align:right}
.track{height:18px; background:var(--bg); border-radius:6px; overflow:hidden; display:flex}
.track span{display:block; height:100%}
.track .a{background:var(--ink)}
.track .b{background:var(--soft)}
.pyr .track{background:transparent; justify-content:center}
.pyr .track > div{display:flex; height:100%; border-radius:6px; overflow:hidden}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.88rem; margin-top:10px}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.legend i.a{background:var(--ink)} .legend i.b{background:var(--soft)}
.scroll{overflow-x:auto}
.chart svg{display:block; height:auto}
table.grid{border-collapse:collapse; width:100%; font-size:.9rem}
table.grid th, table.grid td{padding:7px 8px; border-top:1px solid var(--line); text-align:left; white-space:nowrap}
table.grid thead th{border-top:0; color:var(--muted); font-weight:600}
table.grid td.r, table.grid th.r{text-align:right}
.mini{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px}
.mini h4{margin:0 0 6px; font-size:1rem}
.plain{list-style:none; margin:0; padding:0}
.plain li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line)}
.plain li:first-child{border-top:0}
.dim{color:var(--muted)}
@media (max-width:420px){ .wrap{padding:14px 12px 40px} h1{font-size:1.7rem} .panel{padding:16px} .seg button{font-size:.92rem} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title"><h1>Route log</h1><span class="muted small" id="who"></span></div>
    <div class="topbar" id="topbar" hidden>
      <select id="gymSel" aria-label="Gym"></select>
      <span class="sync" id="sync" role="status"><i></i><span></span></span>
    </div>
  </header>
  <nav class="seg" role="tablist" aria-label="Sections" id="tabs" hidden>
    <button role="tab" data-tab="routes">Routes</button>
    <button role="tab" data-tab="stats">Stats</button>
    <button role="tab" data-tab="archive">Archive</button>
    <button role="tab" data-tab="group">Group</button>
  </nav>
  <main id="view"><section class="panel"><p class="muted">Loading…</p></section></main>
</div>

<script>
  // Shown only if the app code can't load (for example, the very first visit while offline).
  setTimeout(() => {
    if(!window.__routelogStarted){
      document.getElementById('view').innerHTML = '<section class="panel"><h2>Couldn\u2019t load</h2><p class="muted" style="margin-top:8px">Connect to the internet and reload the page once. After that, the app opens without a connection.</p></section>';
    }
  }, 10000);
  if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>

<script type="module">
// =====================================================================
//  1. PASTE YOUR FIREBASE SETTINGS HERE (see SETUP.md)
// =====================================================================
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
// =====================================================================

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, getDoc, setDoc, updateDoc,
  writeBatch, onSnapshot, increment, deleteField, arrayUnion }
  from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

window.__routelogStarted = true;

// ---------- constants ----------
const GRADES = ['VB','V0','V1','V2','V3','V4','V5','V6','V7','V8','V9','V10'];
const HEX = {red:'#E4572E',orange:'#F28C28',yellow:'#F2C230',green:'#3BB273',blue:'#2E9CCA',purple:'#8E44AD',pink:'#E86A9E',black:'#1E2229',white:'#F7F7F4'};
const DEF_COLOURS = ['Red','Orange','Yellow','Green','Blue','Purple','Pink','Black','White'].map(n => ({name:n, shades:[HEX[n.toLowerCase()]]}));
const GREY = '#8A929E';
const STATUS = {none:'Not tried', working:'Working on it', sent:'Sent', flash:'Flashed'};
const LEGACY_KEY = 'routelog.v1';
const MAX_SHADES = 3;
const GAP = 1024;
const BATCH = 8;   // writes per batch; kept small so the security rules' per-request limits are never hit

// ---------- helpers ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
const fmtDate = s => parseD(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const fmtShort = s => parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const fmtMonth = s => parseD(s).toLocaleDateString(undefined,{month:'short',year:'2-digit'});
const fmtStamp = t => t ? new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : 'never';
const isHex = h => typeof h === 'string' && /^#[0-9a-f]{6}$/i.test(h);
const lum = h => { const n = parseInt(h.slice(1),16); return (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255))/255; };
const gIdx = g => { const i = GRADES.indexOf(g); return i < 0 ? 99 : i; };
const str = (v, max=60) => typeof v === 'string' && v.trim() ? v.trim().slice(0,max) : null;
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// ---------- app state ----------
let auth, db, user = null, uid = null;
let groupId = lsGet('routelog.group');
let phase = 'loading';   // config | loading | signedOut | noGroup | joining | app | lost
const D = { group:null, members:{}, gyms:{}, routes:{}, logs:{}, loaded:{}, pending:{}, cache:{} };
let unsubs = [];
const ui = {
  tab:'routes', screen:null, date:today(), gym:null,
  filters:{grade:'', colour:'', location:'', status:''},
  form:null, pending:null, note:'', noteKind:'', armed:null, busy:false,
  stats:{mode:'current', preset:'1m', from:addDays(today(),-30), to:today(), gym:null},
  join:null, afterLoad:null, legacyFiles:{}
};
function setNote(text, kind){ ui.note = text; ui.noteKind = kind || ''; }
function arm(key){
  ui.armed = key; render();
  setTimeout(() => { if(ui.armed === key){ ui.armed = null; render(); } }, 3000);
}

// ---------- refs ----------
const gRef = () => doc(db, 'groups', groupId);
const sub = name => collection(db, 'groups', groupId, name);
const logRef = rid => doc(db, 'groups', groupId, 'logs', `${uid}_${rid}`);

// write without waiting (works offline; Firestore queues it)
function w(p){
  Promise.resolve(p).catch(e => {
    setNote(e && e.code === 'permission-denied' ? 'That change was refused. You may no longer be in this group.' : `A change couldn't be saved (${e && (e.code || e.message)}).`, 'err');
    render();
  });
}

// ---------- colours ----------
const colours = () => (D.group && Array.isArray(D.group.colours) ? D.group.colours : []);
const locations = () => (D.group && Array.isArray(D.group.locations) ? D.group.locations : []);
const colourObj = name => colours().find(c => c.name.toLowerCase() === String(name).toLowerCase());
function paint(shades){
  if(shades.length === 1) return shades[0];
  const step = 100 / shades.length;
  return `linear-gradient(135deg, ${shades.map((h,i) => `${h} ${i*step}% ${(i+1)*step}%`).join(', ')})`;
}
function hcShades(shades){
  shades = (shades || []).filter(isHex); if(!shades.length) shades = [GREY];
  if(shades.length === 1) return `--hc:${shades[0]};--hf:${lum(shades[0]) > .6 ? '#1C2433' : '#fff'}`;
  return `--hc:${paint(shades)};--hf:#fff;--ts:0 0 3px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.9)`;
}
const hc = name => hcShades((colourObj(name) || {shades:[GREY]}).shades);

// ---------- gyms & routes ----------
const gymList = () => Object.values(D.gyms).sort((a,b) => (a.createdAt||0) - (b.createdAt||0) || a.name.localeCompare(b.name));
const gymName = id => (D.gyms[id] && D.gyms[id].name) || 'Unknown gym';
let orderCache = {};
function gymOrder(gymId){
  if(!orderCache[gymId]) orderCache[gymId] = Object.values(D.routes).filter(r => r.gymId === gymId && !r.archived)
    .sort((a,b) => (a.pos ?? 0) - (b.pos ?? 0) || (a.id < b.id ? -1 : 1));
  return orderCache[gymId];
}
const numOf = r => gymOrder(r.gymId).indexOf(r) + 1;
const numText = r => r.archived ? (r.lastNumber ? `was #${r.lastNumber}` : 'archived') : `#${numOf(r)}`;
const label = r => `${esc(r.colour)} ${esc(r.grade)}`;
function posValue(gymId, sel, exclude){
  const list = gymOrder(gymId).filter(r => r.id !== exclude);
  if(!list.length) return 0;
  if(sel === 'start') return (list[0].pos ?? 0) - GAP;
  const i = list.findIndex(r => 'after:' + r.id === sel);
  if(i < 0) return (list[list.length-1].pos ?? 0) + GAP;
  const prev = list[i].pos ?? 0, next = list[i+1];
  return next ? (prev + (next.pos ?? 0)) / 2 : prev + GAP;
}
function defaultPos(gymId, location, exclude){
  const list = gymOrder(gymId).filter(r => r.id !== exclude);
  for(let i = list.length-1; i >= 0; i--) if(list[i].location === location) return 'after:' + list[i].id;
  return list.length ? 'after:' + list[list.length-1].id : 'start';
}
function currentPos(r){ const list = gymOrder(r.gymId); const i = list.indexOf(r); return i <= 0 ? 'start' : 'after:' + list[i-1].id; }

// ---------- logs ----------
const logOf = u => D.logs[u] || {};
const myLog = () => logOf(uid);
const sortByDate = (a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
const visitsIn = (log, id) => (log[id] || []).filter(e => e.attempts > 0).sort(sortByDate);
function summary(log, id){
  const es = visitsIn(log, id);
  if(!es.length) return null;
  let run = 0, sent = null;
  for(const e of es){ run += e.attempts; if(e.sent){ sent = {date:e.date, toSend:run, flash:run===1}; break; } }
  return {es, sent, total: es.reduce((n,e) => n + e.attempts, 0), first: es[0].date};
}
function status(id){
  const s = summary(myLog(), id);
  if(!s) return {kind:'none'};
  if(s.sent) return {kind: s.sent.flash ? 'flash' : 'sent', toSend: s.sent.toSend, visits: s.es.length};
  return {kind:'working', total: s.total, visits: s.es.length};
}
function statusText(st, long){
  if(st.kind === 'none') return long ? 'Not tried yet' : STATUS.none;
  if(st.kind === 'flash') return long ? 'Flashed, sent on the first attempt' : STATUS.flash;
  if(st.kind === 'sent') return long ? `Sent in ${st.toSend} attempts` : `Sent in ${st.toSend}`;
  return long ? `Working on it, ${plural(st.total,'attempt')} over ${plural(st.visits,'visit')}` : `Working on it, ${st.total}`;
}
const myEntry = (rid, date) => (myLog()[rid] || []).find(e => e.date === date);
const logBase = rid => ({uid, routeId:rid, gymId:D.routes[rid].gymId});
function clearVisit(rid, date){ w(setDoc(logRef(rid), {...logBase(rid), visits:{[date]: deleteField()}}, {merge:true})); }
function bumpAttempt(rid, date, delta){
  const cur = myEntry(rid, date);
  if(delta < 0 && (!cur || cur.attempts <= 1)) return clearVisit(rid, date);
  w(setDoc(logRef(rid), {...logBase(rid), visits:{[date]:{attempts: increment(delta)}}}, {merge:true}));
}
function setAttempts(rid, date, n){
  n = Math.max(0, Math.min(999, Math.floor(n) || 0));
  if(!n) return clearVisit(rid, date);
  w(setDoc(logRef(rid), {...logBase(rid), visits:{[date]:{attempts:n}}}, {merge:true}));
}
function setSent(rid, date, sent){
  const cur = myEntry(rid, date);
  const v = {sent: !!sent};
  if(sent && (!cur || cur.attempts < 1)) v.attempts = 1;
  w(setDoc(logRef(rid), {...logBase(rid), visits:{[date]: v}}, {merge:true}));
}

// ---------- Firebase lifecycle ----------
function unsubAll(){ unsubs.forEach(u => { try{ u(); }catch(e){} }); unsubs = []; }
function resetData(){ D.group = null; D.members = {}; D.gyms = {}; D.routes = {}; D.logs = {}; D.loaded = {}; D.pending = {}; D.cache = {}; }
function setGroup(id){ groupId = id; if(id) lsSet('routelog.group', id); else lsDel('routelog.group'); }

function listen(key, ref, onData){
  unsubs.push(onSnapshot(ref, {includeMetadataChanges:true}, snap => {
    D.pending[key] = snap.metadata.hasPendingWrites; D.cache[key] = snap.metadata.fromCache;
    onData(snap); orderCache = {}; D.loaded[key] = true; afterData();
  }, err => {
    if(err && err.code === 'permission-denied'){ phase = 'lost'; unsubAll(); render(); }
  }));
}
function subscribe(){
  unsubAll(); resetData();
  listen('group', gRef(), s => { if(!s.exists()){ phase = 'lost'; return; } D.group = s.data(); });
  listen('members', sub('members'), s => { D.members = {}; s.docs.forEach(d => D.members[d.id] = {uid:d.id, ...d.data()}); });
  listen('gyms', sub('gyms'), s => { D.gyms = {}; s.docs.forEach(d => D.gyms[d.id] = {id:d.id, ...d.data()}); });
  listen('routes', sub('routes'), s => { D.routes = {}; s.docs.forEach(d => D.routes[d.id] = {id:d.id, ...d.data()}); });
  listen('logs', sub('logs'), s => {
    D.logs = {};
    s.docs.forEach(d => {
      const x = d.data(); if(!x.uid || !x.routeId) return;
      const list = Object.entries(x.visits || {}).filter(([k]) => isDate(k))
        .map(([date, v]) => ({date, attempts: Math.max(0, Math.floor((v && v.attempts) || 0)), sent: !!(v && v.sent)}))
        .filter(e => e.attempts > 0);
      if(list.length) (D.logs[x.uid] || (D.logs[x.uid] = {}))[x.routeId] = list;
    });
  });
}
const allLoaded = () => ['group','members','gyms','routes','logs'].every(k => D.loaded[k]);
function afterData(){
  if(phase === 'lost') return scheduleRender();
  if(allLoaded()){
    if(D.members[uid] === undefined && !D.cache.members){ phase = 'lost'; unsubAll(); }
    const gyms = gymList();
    if(!ui.gym || !D.gyms[ui.gym]){
      const saved = lsGet('routelog.gym.' + groupId);
      ui.gym = saved && D.gyms[saved] ? saved : (gyms[0] && gyms[0].id) || null;
    }
    if(ui.afterLoad){ const f = ui.afterLoad; ui.afterLoad = null; f(); }
  }
  scheduleRender();
}

// Avoid re-rendering under someone who's typing; catch up when they leave the field.
let renderQueued = false;
function scheduleRender(){
  const a = document.activeElement;
  if(a && a.closest && a.closest('#view') && a.matches('input[type=text], input[type=number], input[type=date], input[type=color]')){
    if(!renderQueued){ renderQueued = true; a.addEventListener('blur', () => { renderQueued = false; setTimeout(render, 0); }, {once:true}); }
    updateChrome(); return;
  }
  render();
}

// ---------- old version data ----------
function normColours(list){
  return (Array.isArray(list) ? list : []).map(c => {
    if(typeof c === 'string') return str(c,30) ? {name:str(c,30), shades:[HEX[c.toLowerCase()] || GREY]} : null;
    if(!c || !str(c.name,30)) return null;
    const shades = (Array.isArray(c.shades) ? c.shades : []).filter(isHex).slice(0, MAX_SHADES);
    return {name:str(c.name,30), shades: shades.length ? shades : [HEX[c.name.toLowerCase()] || GREY]};
  }).filter(Boolean);
}
function cleanLog(log){
  const out = {};
  if(!log || typeof log !== 'object') return out;
  Object.entries(log).forEach(([id, list]) => {
    if(!Array.isArray(list)) return;
    const seen = new Set();
    const es = list.filter(e => e && isDate(e.date) && Number.isFinite(+e.attempts) && +e.attempts >= 1 && !seen.has(e.date) && seen.add(e.date))
      .map(e => ({date:e.date, attempts:Math.min(999, Math.floor(+e.attempts)), sent:!!e.sent}));
    if(es.length) out[String(id)] = es;
  });
  return out;
}
function cleanRoute(id, r){
  if(!r) return null;
  return {id:String(id), grade:str(r.grade)||'?', colour:str(r.colour)||'Unknown', location:str(r.location)||'Unknown',
    addedOn: isDate(r.addedOn) ? r.addedOn : null, archived: !!r.archived, archivedOn: isDate(r.archivedOn) ? r.archivedOn : null,
    lastNumber: Number.isFinite(r.lastNumber) ? r.lastNumber : null};
}
function legacyLocal(){
  let S; try{ S = JSON.parse(lsGet(LEGACY_KEY) || 'null'); }catch(e){ return null; }
  if(!S || typeof S !== 'object') return null;
  const routes = {};
  Object.entries(S.routes || {}).forEach(([id, r]) => { const c = cleanRoute(id, r); if(c) routes[c.id] = c; });
  const log = cleanLog(S.log);
  if(!Object.keys(routes).length && !Object.keys(log).length) return null;
  let order = Array.isArray(S.order) ? S.order.filter(id => routes[id] && !routes[id].archived) : [];
  const missing = Object.values(routes).filter(r => !r.archived && !order.includes(r.id));
  const locs = Array.isArray(S.locations) ? S.locations : [];
  missing.sort((a,b) => (locs.indexOf(a.location)+1||999) - (locs.indexOf(b.location)+1||999) || gIdx(a.grade)-gIdx(b.grade) || a.colour.localeCompare(b.colour));
  order = order.concat(missing.map(r => r.id));
  return {source:'device', routes, order, log, colours: normColours(S.colours && S.colours.length ? S.colours : DEF_COLOURS),
    locations: locs.map(l => str(l,40)).filter(Boolean)};
}
function legacyFromFiles(){
  const rf = ui.legacyFiles.routes, res = ui.legacyFiles.results;
  if(!rf && !res) return null;
  const routes = {}, order = [];
  (rf && Array.isArray(rf.routes) ? rf.routes : []).forEach(r => { const c = cleanRoute(r && r.id, r); if(c && r.id && !routes[c.id]){ routes[c.id] = c; order.push(c.id); } });
  const log = res ? cleanLog(res.log) : {};
  Object.keys(log).forEach(id => { if(!routes[id]){ const c = cleanRoute(id, (res.routes || {})[id] || {}); c.archived = true; routes[id] = c; } });
  return {source:'files', routes, order, log, colours: normColours(rf && rf.colours), locations: (rf && Array.isArray(rf.locations) ? rf.locations : []).map(l => str(l,40)).filter(Boolean)};
}
function planMigration(legacy, gymId){
  const activeHere = gymOrder(gymId).length;
  const createActive = activeHere === 0;
  const plan = {newActive:[], newArchived:[], matched:0, visits:0, logRoutes:[]};
  if(createActive) legacy.order.forEach(id => { if(!D.routes[id]) plan.newActive.push(legacy.routes[id]); });
  const planned = new Set(plan.newActive.map(r => r.id));
  Object.keys(legacy.log).forEach(id => {
    if(D.routes[id]) plan.matched++;
    else if(!planned.has(id)){ plan.newArchived.push(legacy.routes[id] || cleanRoute(id, {})); planned.add(id); }
    plan.logRoutes.push(id);
    plan.visits += legacy.log[id].length;
  });
  return plan;
}
async function runMigration(legacy, gymId){
  const plan = planMigration(legacy, gymId);
  ui.screen = {kind:'progress', text:'Moving your data into the group. Keep the app open with an internet connection.'}; render();
  try{
    const ops = [];
    const newCols = legacy.colours.filter(c => !colourObj(c.name));
    const newLocs = legacy.locations.filter(l => !locations().some(x => x.toLowerCase() === l.toLowerCase()));
    const extraLocs = [...plan.newActive, ...plan.newArchived].map(r => r.location).filter(l => l && l !== 'Unknown' && !locations().includes(l) && !newLocs.includes(l));
    const allLocs = [...new Set([...newLocs, ...extraLocs])];
    if(newCols.length) ops.push(b => b.update(gRef(), {colours: arrayUnion(...newCols)}));
    if(allLocs.length) ops.push(b => b.update(gRef(), {locations: arrayUnion(...allLocs)}));
    const base = gymOrder(gymId).length ? (gymOrder(gymId).at(-1).pos ?? 0) : 0;
    plan.newActive.forEach((r,i) => ops.push(b => b.set(doc(db,'groups',groupId,'routes',r.id),
      {gymId, grade:r.grade, colour:r.colour, location:r.location, pos: base + (i+1)*GAP, addedOn:r.addedOn, archived:false, archivedOn:null, lastNumber:null, createdBy:uid})));
    plan.newArchived.forEach(r => ops.push(b => b.set(doc(db,'groups',groupId,'routes',r.id),
      {gymId, grade:r.grade, colour:r.colour, location:r.location, pos:0, addedOn:r.addedOn, archived:true, archivedOn:r.archivedOn, lastNumber:r.lastNumber, createdBy:uid})));
    plan.logRoutes.forEach(id => {
      const visits = {}; legacy.log[id].forEach(e => visits[e.date] = {attempts:e.attempts, sent:e.sent});
      const rGym = D.routes[id] ? D.routes[id].gymId : gymId;
      ops.push(b => b.set(doc(db,'groups',groupId,'logs',`${uid}_${id}`), {uid, routeId:id, gymId:rGym, visits}, {merge:true}));
    });
    for(let i = 0; i < ops.length; i += BATCH){
      const b = writeBatch(db); ops.slice(i, i+BATCH).forEach(f => f(b)); await b.commit();
      ui.screen = {kind:'progress', text:`Moving your data into the group… ${Math.min(100, Math.round((i+BATCH)/ops.length*100))}%. Keep the app open with an internet connection.`}; render();
    }
    if(legacy.source === 'device'){ const raw = lsGet(LEGACY_KEY); if(raw) lsSet(LEGACY_KEY + '.moved', raw); lsDel(LEGACY_KEY); }
    ui.legacyFiles = {};
    ui.screen = null; ui.tab = 'routes'; ui.gym = gymId;
    setNote(`Moved: ${plural(plan.newActive.length,'route')} added, ${plan.matched} matched, ${plan.newArchived.length} added to the archive, ${plural(plan.visits,'visit')}.`, 'good');
  }catch(e){
    ui.screen = {kind:'migrate', source:legacy.source};
    setNote(`The move didn't finish (${e.code || e.message}). Nothing was removed from this device. Try again with a connection.`, 'err');
  }
  render();
}

function download(filename, obj){
  const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
}
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'climber';
const myName = () => (D.members[uid] && D.members[uid].name) || (user && user.displayName) || 'Climber';
function backupFile(){
  return {type:'route-log/backup', version:3, exportedAt:new Date().toISOString(), name:myName(), group:{name:D.group && D.group.name},
    colours:colours(), locations:locations(), gyms:gymList().map(g => ({id:g.id, name:g.name})),

      addedOn:r.addedOn || null, archived:!!r.archived, archivedOn:r.archivedOn || null, lastNumber:r.lastNumber ?? null})),
    log:myLog()};
}
function prepareRestore(data){
  let log, routes = {};
  if(data && data.type === 'route-log/backup'){
    log = cleanLog(data.log);
    (data.routes || []).forEach(r => { const c = cleanRoute(r && r.id, r); if(c && r.id){ c.gymId = str(r.gymId); routes[c.id] = c; } });
  } else if(data && data.type === 'route-log/results'){
    log = cleanLog(data.log);
    Object.entries(data.routes || {}).forEach(([id, r]) => { const c = cleanRoute(id, r); if(c) routes[id] = c; });
  } else { setNote('That file isn\'t a Route log backup.', 'err'); return; }
  const ids = Object.keys(log);
  ui.pending = {kind:'restore', log, routes, matched: ids.filter(id => D.routes[id]).length, missing: ids.filter(id => !D.routes[id]).length,
    visits: ids.reduce((n,id) => n + log[id].length, 0), exportedAt:data.exportedAt};
  setNote('');
}
async function applyRestore(p){
  const ops = [];
  Object.keys(p.log).forEach(id => {
    let gymId;
    if(D.routes[id]) gymId = D.routes[id].gymId;
    else {
      const r = p.routes[id] || cleanRoute(id, {});

      ops.push(b => b.set(doc(db,'groups',groupId,'routes',id), {gymId, grade:r.grade, colour:r.colour, location:r.location, pos:0,
        addedOn:r.addedOn, archived:true, archivedOn:r.archivedOn || null, lastNumber:r.lastNumber ?? null, createdBy:uid}));
    }
    const visits = {}; p.log[id].forEach(e => visits[e.date] = {attempts:e.attempts, sent:e.sent});
    ops.push(b => b.set(doc(db,'groups',groupId,'logs',`${uid}_${id}`), {uid, routeId:id, gymId, visits}, {merge:true}));
  });
  for(let i = 0; i < ops.length; i += BATCH){ const b = writeBatch(db); ops.slice(i, i+BATCH).forEach(f => f(b)); w(b.commit()); }
  setNote(`Backup restored: ${plural(p.visits,'visit')} merged into your log.${p.missing ? ` ${p.missing} route${p.missing===1?' wasn\'t':'s weren\'t'} in the group, so ${p.missing===1?'it was':'they were'} added to the archive.` : ''}`, 'good');
}
function readJson(file, cb){
  const reader = new FileReader();
  reader.onload = () => { let d; try{ d = JSON.parse(reader.result); }catch(e){ setNote('That file couldn\'t be read. Pick a .json file from Route log.', 'err'); render(); return; } cb(d); render(); };
  reader.onerror = () => { setNote('That file couldn\'t be opened.', 'err'); render(); };
  reader.readAsText(file);
}

// ---------- stats ----------
function statsView(){
  const s = ui.stats;
  if(s.mode !== 'period') return {mode:s.mode, range:false};
  let from = s.from, to = s.to;
  if(s.preset === '1m'){ to = today(); from = addDays(to,-30); }
  else if(s.preset === '3m'){ to = today(); from = addDays(to,-91); }
  else if(s.preset === 'year'){ to = today(); from = `${to.slice(0,4)}-01-01`; }
  if(from > to) [from, to] = [to, from];
  return {mode:'period', range:true, from, to};
}
const inRange = (d, V) => !V.range || (d >= V.from && d <= V.to);
function routeSet(V, gymSel){
  const gyms = gymSel === 'all' ? gymList().map(g => g.id) : [gymSel];
  let out = [];
  gyms.forEach(gid => {
    const active = gymOrder(gid);
    const archived = Object.values(D.routes).filter(r => r.gymId === gid && r.archived).sort((a,b) => (a.lastNumber||999)-(b.lastNumber||999));
    if(V.mode === 'current') out = out.concat(active);
    else if(V.mode === 'lifetime') out = out.concat(active, archived);
    else out = out.concat(active, archived).filter(r => (!r.addedOn || r.addedOn <= V.to) && (!r.archivedOn || r.archivedOn >= V.from));
  });
  return out;
}
function info(log, id, V){
  const s = summary(log, id);
  if(!s) return {tried:false, attempts:0, sent:null, project:false, firstInView:false, sentEverByEnd:false};
  const es = V.range ? s.es.filter(e => inRange(e.date, V)) : s.es;
  const attempts = es.reduce((n,e) => n + e.attempts, 0);
  const sent = s.sent && inRange(s.sent.date, V) ? s.sent : null;
  const sentBy = !!(s.sent && (!V.range || s.sent.date <= V.to));
  return {tried: attempts > 0, attempts, sent, project: attempts > 0 && !sentBy, firstInView: inRange(s.first, V), sentEverByEnd: sentBy};
}
function people(){
  return Object.values(D.members).sort((a,b) => (a.uid===uid?-1:b.uid===uid?1:0) || String(a.name).localeCompare(String(b.name)))
    .map(m => ({name:m.name || 'Climber', you:m.uid===uid, log:logOf(m.uid)}));
}
const personLabel = p => p.you ? `${esc(p.name)} (you)` : esc(p.name);
function pyramidHtml(routes, log, V, maxOverride){
  const rows = GRADES.map(g => {
    let f = 0, s = 0;
    routes.forEach(r => { if(r.grade !== g) return; const i = info(log, r.id, V); if(i.sent){ i.sent.flash ? f++ : s++; } });
    return {g, f, s};
  });
  const used = rows.filter(r => r.f + r.s);
  if(!used.length) return `<p class="muted">No sends ${V.range ? 'in this period' : 'yet'}.</p>`;
  const lo = gIdx(used[0].g), hi = gIdx(used[used.length-1].g);
  const max = maxOverride || Math.max(...used.map(r => r.f + r.s));
  return `<div class="bars pyr">${rows.filter(r => gIdx(r.g) >= lo && gIdx(r.g) <= hi).reverse().map(r => {
    const tot = r.f + r.s;
    return `<div class="row"><span class="lab num">${r.g}</span>
      <div class="track"><div style="width:${tot/max*100}%">${r.f?`<span class="a" style="flex:${r.f}"></span>`:''}${r.s?`<span class="b" style="flex:${r.s}"></span>`:''}</div></div>
      <span class="val num">${tot}</span></div>`;
  }).join('')}</div>`;
}
const legendFS = `<div class="legend muted"><span><i class="a"></i>Flashed</span><span><i class="b"></i>Sent after more attempts</span></div>`;
function barRows(items, cls){
  return `<div class="bars ${cls||''}">${items.map(it => `<div class="row"><span class="lab num">${esc(it.lab)}</span>
    <div class="track">${it.a?`<span class="a" style="width:${it.a/it.max*100}%"></span>`:''}${it.b?`<span class="b" style="width:${it.b/it.max*100}%"></span>`:''}</div>
    <span class="val num">${it.val}</span></div>`).join('')}</div>`;
}
function activityChart(V, routes){
  const ids = new Set(routes.map(r => r.id));
  const log = myLog(), dates = {};
  Object.keys(log).forEach(id => {
    if(!ids.has(id)) return;
    log[id].forEach(e => { if(!inRange(e.date, V)) return; (dates[e.date] || (dates[e.date] = {att:0, sends:0})).att += e.attempts; });
    const s = summary(log, id); if(s && s.sent && inRange(s.sent.date, V)) (dates[s.sent.date] || (dates[s.sent.date] = {att:0, sends:0})).sends++;
  });
  const keys = Object.keys(dates).sort();
  if(!keys.length) return `<p class="muted">No visits ${V.range ? 'in this period' : 'yet'}.</p>`;
  const start = V.range ? V.from : keys[0], end = V.range ? V.to : keys[keys.length-1];
  const spanDays = (parseD(end) - parseD(start)) / 864e5;
  let buckets;
  if(spanDays <= 62) buckets = keys.map(k => ({lab:fmtShort(k), ...dates[k]}));
  else {
    const m = {};
    keys.forEach(k => { const mk = k.slice(0,7); const b = m[mk] || (m[mk] = {att:0, sends:0}); b.att += dates[k].att; b.sends += dates[k].sends; });
    buckets = []; const cur = parseD(start.slice(0,7) + '-01'), last = end.slice(0,7);
    for(let guard = 0; guard < 600; guard++){ const mk = dstr(cur).slice(0,7); buckets.push({lab:fmtMonth(mk+'-01'), ...(m[mk] || {att:0, sends:0})}); if(mk >= last) break; cur.setMonth(cur.getMonth()+1); }
  }
  const max = Math.max(1, ...buckets.map(b => b.att));
  const bw = 44, H = 200, top = 16, bottom = 36, W = Math.max(320, buckets.length * bw + 36);
  const y = v => top + (H - top - bottom) * (1 - v / max);
  const ticks = [0, Math.ceil(max/2), max].filter((v,i,a) => a.indexOf(v) === i);
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Attempts and sends ${spanDays <= 62 ? 'per visit date' : 'per month'}">
    ${ticks.map(t => `<line x1="30" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="24" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
    ${buckets.map((b,i) => { const x = 36 + i*bw;
      return `<rect x="${x}" y="${y(b.att)}" width="16" height="${y(0)-y(b.att)}" rx="3" fill="var(--soft)"><title>${esc(b.lab)}: ${plural(b.att,'attempt')}</title></rect>
      <rect x="${x+18}" y="${y(b.sends)}" width="16" height="${y(0)-y(b.sends)}" rx="3" fill="var(--ink)"><title>${esc(b.lab)}: ${plural(b.sends,'send')}</title></rect>
      <text x="${x+17}" y="${H-bottom+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.lab)}</text>`; }).join('')}
  </svg>`;
  return `<div class="scroll chart">${svg}</div>
    <div class="legend muted"><span><i class="b"></i>Attempts</span><span><i class="a"></i>New sends</span><span>${spanDays <= 62 ? 'Per visit date' : 'Per month'}</span></div>`;
}
function cellText(i){
  if(i.sent) return i.sent.flash ? 'Flashed' : `Sent in ${i.sent.toSend}`;
  if(i.tried) return `Trying, ${i.attempts}`;
  return '<span class="dim">–</span>';
}

  if(!routes.length) return head + `<section class="panel empty"><p>No routes to show stats for yet.</p></section>`;

  const mine = routes.map(r => ({r, i:info(me, r.id, V)}));
  const sends = mine.filter(x => x.i.sent), flashes = sends.filter(x => x.i.sent.flash);

  const hs = hardest(sends), hf = hardest(flashes);
  const gradesInSet = GRADES.filter(g => routes.some(r => r.grade === g));
  const completion = gradesInSet.map(g => {
    const inG = mine.filter(x => x.r.grade === g);
    const f = inG.filter(x => x.i.sent && x.i.sent.flash).length, sn = inG.filter(x => x.i.sent && !x.i.sent.flash).length;
    return {lab:g, a:f, b:sn, max:inG.length, val:`${f+sn} of ${inG.length}`};
  });
  const locs = [...new Set(routes.map(r => r.location))];
  const locCompletion = locs.map(l => { const inL = mine.filter(x => x.r.location === l); const done = inL.filter(x => x.i.sent).length;
    return {lab:l, a:done, b:0, max:inL.length, val:`${done} of ${inL.length}`}; });
  const avgAtt = gradesInSet.map(g => { const sg = sends.filter(x => x.r.grade === g);

  const maxAvg = Math.max(1, ...avgAtt.map(x => x.avg));
  const flashRate = gradesInSet.map(g => { const tried = mine.filter(x => x.r.grade === g && x.i.tried && x.i.firstInView);

  const projects = mine.filter(x => x.i.project).sort((a,b) => b.i.attempts - a.i.attempts);
  const none = V.range ? 'in this period' : 'yet';

  const personal = `<h2 class="section-title">You</h2>
    <section class="panel"><div class="big-stats num">
      <div><b>${sends.length}</b><span class="muted">sends, ${flashes.length} flashed</span></div>
      <div><b>${hs ? esc(hs.r.grade) : '–'}</b><span class="muted">hardest send${hs ? `, ${rlab(hs.r)}` : ''}</span></div>
      <div><b>${hf ? esc(hf.r.grade) : '–'}</b><span class="muted">hardest flash${hf ? `, ${rlab(hf.r)}` : ''}</span></div>
    </div></section>
    <section class="panel"><h3>Grade pyramid</h3>${pyramidHtml(routes, me, V)}${sends.length ? legendFS : ''}</section>
    <section class="panel"><h3>Completion by grade</h3>${barRows(completion)}${legendFS}</section>
    <section class="panel"><h3>Completion by location</h3>${barRows(locCompletion, 'wide')}</section>
    <section class="panel"><h3>Average attempts to send</h3>
      ${avgAtt.length ? barRows(avgAtt.map(x => ({lab:x.g, a:x.avg, b:0, max:maxAvg, val:`${x.avg.toFixed(1)} (${x.n})`})))
        + `<p class="muted small" style="margin-top:8px">Number of sends in brackets.</p>` : `<p class="muted">No sends ${none}.</p>`}</section>
    <section class="panel"><h3>Flash rate by grade</h3>
      ${flashRate.length ? barRows(flashRate.map(x => ({lab:x.g, a:x.f, b:0, max:x.t, val:`${x.f} of ${x.t}, ${pct(x.f,x.t)}%`})))
        + `<p class="muted small" style="margin-top:8px">Flashed out of routes first tried${V.range ? ' in this period' : ''}.</p>` : `<p class="muted">No routes tried ${none}.</p>`}</section>
    <section class="panel"><h3>Current projects</h3>
      ${projects.length ? `<ul class="plain">${projects.map(x => `<li><span>${rlab(x.r)} <span class="muted">${esc(x.r.location)}</span></span><span class="num">${plural(x.i.attempts,'attempt')}</span></li>`).join('')}</ul>`
        : `<p class="muted">No unsent routes ${V.range ? 'tried in this period' : 'being worked on'}.</p>`}</section>
    <section class="panel"><h3>Activity</h3>${activityChart(V, routes)}</section>`;

  if(P.length < 2) return head + personal + `<h2 class="section-title">Group</h2>
    <section class="panel empty"><p>Group stats appear once someone else joins. Share the invite link from the Group tab.</p><button class="btn" data-tab="group">Go to Group</button></section>`;

  const grid = routes.map(r => ({r, cells: P.map(p => info(p.log, r.id, V))}));
  const touched = grid.filter(g => g.cells.some(c => c.tried || c.sent));
  const routeView = `<section class="panel"><h3>Route view</h3>
    ${touched.length ? `<div class="scroll"><table class="grid num"><thead><tr><th>Route</th>${P.map(p => `<th>${personLabel(p)}</th>`).join('')}</tr></thead>
      <tbody>${touched.map(g => `<tr><td><span class="chip tiny" style="${hc(g.r.colour)}"></span> ${rlab(g.r)}</td>${g.cells.map(c => `<td>${cellText(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
      : `<p class="muted">Nobody has logged anything ${none}.</p>`}</section>`;
  const groupComp = gradesInSet.map(g => {
    const inG = grid.filter(x => x.r.grade === g);
    return {g, total:inG.length, anyone: inG.filter(x => x.cells.some(c => c.sent)).length,
      halfers: P.filter((p,pi) => inG.length && inG.filter(x => x.cells[pi].sent).length * 2 >= inG.length).length};
  });
  const groupCompHtml = `<section class="panel"><h3>Group completion by grade</h3>
    <div class="scroll"><table class="grid num"><thead><tr><th>Grade</th><th class="r">Sent by anyone</th><th class="r">Climbers with ½+ sent</th></tr></thead>
    <tbody>${groupComp.map(x => `<tr><td>${x.g}</td><td class="r">${x.anyone} of ${x.total}</td><td class="r">${x.halfers} of ${P.length}</td></tr>`).join('')}</tbody></table></div></section>`;
  const tough = touched.map(g => {
    const senders = g.cells.filter(c => c.sent);
    return {r:g.r, senders:senders.length, triers:g.cells.filter(c => c.tried || c.sent).length,
      avg: senders.length ? senders.reduce((n,c) => n + c.sent.toSend, 0) / senders.length : null, attempts: g.cells.reduce((n,c) => n + c.attempts, 0)};
  });
  const byAvg = tough.filter(t => t.avg !== null && t.avg > 1).sort((a,b) => b.avg - a.avg).slice(0,8);
  const byFew = tough.slice().sort((a,b) => a.senders/a.triers - b.senders/b.triers || b.attempts - a.attempts).slice(0,8);
  const toughHtml = `<section class="panel"><h3>Toughest routes</h3><div class="mini">
    <div><h4>Most attempts per send</h4>${byAvg.length ? `<ul class="plain">${byAvg.map(t => `<li><span>${rlab(t.r)}</span><span class="num">${t.avg.toFixed(1)}</span></li>`).join('')}</ul>` : '<p class="muted">Nothing yet.</p>'}</div>
    <div><h4>Fewest climbers have topped</h4>${byFew.length ? `<ul class="plain">${byFew.map(t => `<li><span>${rlab(t.r)}</span><span class="num">${t.senders} of ${t.triers} tried</span></li>`).join('')}</ul>` : '<p class="muted">Nothing yet.</p>'}</div>
  </div></section>`;

  const betaHtml = `<section class="panel"><h3>Beta opportunities</h3>
    ${beta.length ? `<ul class="plain">${beta.map(b => `<li><span>${rlab(b.r)} <span class="muted">${esc(b.r.location)}</span></span><span>${b.who.map(esc).join(', ')}</span></li>`).join('')}</ul>`
      : `<p class="muted">None of your current projects have been sent by anyone else yet.</p>`}</section>`;

    <tbody>${gradesInSet.map(g => { const inG = grid.filter(x => x.r.grade === g);
      return `<tr><td>${g}</td>${P.map((p,pi) => `<td class="r">${inG.filter(x => x.cells[pi].sent).length} of ${inG.length}</td>`).join('')}</tr>`; }).join('')}
    </tbody></table></div></section>`;
  return head + personal + `<h2 class="section-title">Group</h2>` + routeView + groupCompHtml + toughHtml + betaHtml + sideHtml;
}

function renderTab(){

// ---------- form handling ----------
function syncForm(){

  const pos = document.getElementById('posSel'); if(pos && pos.value) f.pos = pos.value;
  const nl = document.getElementById('newLocation'); if(nl) f.newLocText = nl.value;

    const n = document.getElementById('edName'); if(n) f.editor.name = n.value;

  }
}
function openForm(id){
  const r = id && D.routes[id];
  if(r) ui.form = {id, gymId:r.gymId, grade:r.grade, colour:r.colour, location:r.location, pos:currentPos(r), posTouched:true};
  else {
    const last = ui.last || {};
    const location = last.location && locations().includes(last.location) ? last.location : (locations()[0] || null);
    ui.form = {id:null, gymId:ui.gym, grade:last.grade || null, colour:last.colour || null, location, pos:defaultPos(ui.gym, location), posTouched:false};

function saveRoute(another){
  syncForm();
  const f = ui.form;
  if(!f.grade || !f.colour || !f.location){ setNote('Choose a grade, a colour and a location to save the route.', 'err'); render(); return; }
  const pos = posValue(f.gymId, f.pos, f.id);
  if(f.id){
    const r = D.routes[f.id];
    const moved = currentPos(r) !== f.pos;
    w(updateDoc(doc(sub('routes'), f.id), {grade:f.grade, colour:f.colour, location:f.location, ...(moved ? {pos} : {})}));
    ui.screen = {kind:'route', id:f.id}; setNote('Route updated.', 'good'); render(); return;
  }
  const ref = doc(sub('routes'));
  w(setDoc(ref, {gymId:f.gymId, grade:f.grade, colour:f.colour, location:f.location, pos, addedOn:today(), archived:false, archivedOn:null, lastNumber:null, createdBy:uid}));
  ui.last = {grade:f.grade, colour:f.colour, location:f.location};
  if(another){
    ui.form = {id:null, gymId:f.gymId, grade:f.grade, colour:f.colour, location:f.location, pos:'after:'+ref.id, posTouched:false};
    setNote(`Added ${f.colour} ${f.grade} at ${f.location}. The next route goes straight after it.`, 'good'); render();

function saveColour(){
  syncForm();

    if(colourObj(name)){ setNote(`There's already a colour called ${colourObj(name).name}. Choose it, or use a different name.`, 'err'); render(); return; }
    w(updateDoc(gRef(), {colours: arrayUnion({name, shades})}));

// ---------- events ----------
const currentRouteId = () => ui.screen && ui.screen.kind === 'route' ? ui.screen.id : null;
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if(!t) return;
  const d = t.dataset, id = currentRouteId();
  if(d.tab){ ui.tab = d.tab; ui.screen = null; ui.armed = null; ui.pending = null; ui.renameGym = null; setNote(''); render(); window.scrollTo(0,0); return; }
  if(d.open){ ui.screen = {kind:'route', id:d.open}; ui.date = today(); setNote(''); render(); window.scrollTo(0,0); return; }

  }

    case 'signIn': setNote(''); doSignIn(); return;

    case 'createGroup': {

    case 'forgetGroup': unsubAll(); resetData(); setGroup(null); try{ await setDoc(doc(db,'users',uid), {groupId:null}, {merge:true}); }catch(e){} phase = 'noGroup'; render(); return;
    case 'back': ui.screen = (ui.screen?.kind === 'form' && ui.form?.id) ? {kind:'route', id:ui.form.id} : null; ui.armed = null; setNote(''); render(); return;
    case 'newRoute': openForm(null); return;
    case 'editRoute': openForm(id); return;
    case 'newColour': syncForm(); ui.form.editor = {mode:'new', name:'', shades:['#888888']}; setNote(''); render(); document.getElementById('edName')?.focus(); return;
    case 'editColour': { syncForm(); const c = colourObj(ui.form.colour); if(c){ ui.form.editor = {mode:'edit', name:c.name, shades:c.shades.slice()}; setNote(''); render(); } return; }
    case 'addShade': syncForm(); if(ui.form.editor.shades.length < MAX_SHADES) ui.form.editor.shades.push('#888888'); render(); return;
    case 'cancelColour': syncForm(); ui.form.editor = null; render(); return;
    case 'saveColour': saveColour(); return;
    case 'showAddLocation': syncForm(); ui.form.addLocation = true; render(); document.getElementById('newLocation')?.focus(); return;
    case 'addLocation': {
      syncForm();
      const v = (ui.form.newLocText || '').trim().slice(0,40);
      if(!v) return;
      const existing = locations().find(l => l.toLowerCase() === v.toLowerCase());
      if(!existing) w(updateDoc(gRef(), {locations: arrayUnion(v)}));
      const f = ui.form; f.location = existing || v; f.addLocation = false; f.newLocText = '';
      if(!f.posTouched) f.pos = defaultPos(f.gymId, f.location, f.id);
      setNote(''); render(); return;
    }
    case 'saveRoute': saveRoute(false); return;
    case 'saveAnother': saveRoute(true); return;
    case 'archiveRoute':
      if(ui.armed === 'archive'){
        ui.armed = null; const r = D.routes[ui.form.id];
        w(updateDoc(doc(sub('routes'), r.id), {archived:true, archivedOn:today(), lastNumber:numOf(r)}));
        ui.screen = null; ui.tab = 'archive'; setNote(''); render();
      } else { syncForm(); arm('archive'); }
      return;
    case 'plus': { const n = ((myEntry(id, ui.date)||{attempts:0}).attempts) + 1; bumpAttempt(id, ui.date, 1); setNote(`Attempt ${n} logged.`, 'good'); render(); return; }
    case 'minus': bumpAttempt(id, ui.date, -1); setNote('Attempt removed.', 'good'); render(); return;
    case 'copyLink': {
      const link = `${location.origin}${location.pathname}?join=${groupId}`;
      try{ await navigator.clipboard.writeText(link); setNote('Invite link copied.', 'good'); }catch(err){ setNote('Couldn\'t copy automatically. Press and hold the link to copy it.', 'err'); }
      render(); return;
    }
    case 'shareLink': try{ await navigator.share({title:`Join ${D.group.name} on Route log`, url:`${location.origin}${location.pathname}?join=${groupId}`}); }catch(err){} return;
    case 'addGym': {
      const v = document.getElementById('newGym').value.trim().slice(0,40); if(!v) return;
      if(gymList().some(g => g.name.toLowerCase() === v.toLowerCase())){ setNote(`There's already a gym called ${v}.`, 'err'); render(); return; }
      const ref = doc(sub('gyms')); w(setDoc(ref, {name:v, createdAt:Date.now(), createdBy:uid}));
      setNote(`${v} added. Switch to it with the gym picker at the top.`, 'good'); render(); return;
    }
    case 'saveGymName': {
      const v = document.getElementById('gymRename').value.trim().slice(0,40);
      if(v) w(updateDoc(doc(sub('gyms'), ui.renameGym), {name:v}));
      ui.renameGym = null; render(); return;
    }
    case 'renameSelf': {
      const v = document.getElementById('nameEdit').value.trim().slice(0,40);
      if(v){ w(updateDoc(doc(sub('members'), uid), {name:v})); setNote('Name saved.', 'good'); render(); } return;
    }
    case 'exportBackup': download(`route-log-backup-${slug(myName())}-${today()}.json`, backupFile()); setNote('Backup exported.', 'good'); render(); return;
    case 'applyRestore': { const p = ui.pending; ui.pending = null; await applyRestore(p); render(); return; }
    case 'cancelRestore': ui.pending = null; setNote('Restore cancelled. Nothing was changed.'); render(); return;
    case 'openMigrateDevice': ui.screen = {kind:'migrate', source:'device'}; setNote(''); render(); return;
    case 'openMigrateFiles': ui.screen = {kind:'migrate', source:'files'}; ui.legacyFiles = {}; setNote(''); render(); return;
    case 'skipMigrate': if(ui.screen.source === 'device') lsSet('routelog.moveDismissed.' + groupId, '1'); ui.screen = null; setNote(''); render(); return;
    case 'runMigrate': {
      const legacy = ui.screen.source === 'device' ? legacyLocal() : legacyFromFiles();
      const gymId = document.getElementById('migGym')?.value || ui.gym;
      if(legacy) runMigration(legacy, gymId); return;
    }
    case 'leaveGroup':
      if(ui.armed === 'leave'){
        ui.armed = null;
        try{ const b = writeBatch(db); b.delete(doc(sub('members'), uid)); b.set(doc(db,'users',uid), {groupId:null}, {merge:true}); await b.commit(); }
        catch(err){ setNote(`Leaving needs an internet connection (${err.code || err.message}).`, 'err'); render(); return; }
        unsubAll(); resetData(); setGroup(null); phase = 'noGroup'; render();
      } else arm('leave');
      return;
  }
});
document.addEventListener('change', e => {
  const t = e.target, id = currentRouteId();
  if(t.id === 'gymSel'){ ui.gym = t.value; lsSet('routelog.gym.' + groupId, t.value); ui.screen = null; ui.filters = {grade:'', colour:'', location:'', status:''}; ui.stats.gym = t.value; setNote(''); render(); return; }
  if(t.dataset.filter !== undefined){ ui.filters[t.dataset.filter] = t.value; render(); return; }
  if(t.id === 'statsGym'){ ui.stats.gym = t.value; render(); return; }
  if(t.id === 'migGym'){ ui.screen.gymId = t.value; render(); return; }
  if(t.matches('[data-restore]')){ const f = t.files && t.files[0]; if(f) readJson(f, prepareRestore); t.value = ''; return; }
  if(t.matches('[data-legacy]')){
    const kind = t.dataset.legacy, f = t.files && t.files[0];
    if(f) readJson(f, data => {
      const want = kind === 'routes' ? 'route-log/routes' : 'route-log/results';
      if(!data || data.type !== want){ setNote(`That isn't a ${kind === 'routes' ? 'route file' : 'results file'} from the previous version.`, 'err'); return; }
      ui.legacyFiles[kind] = data; setNote('');
    });
    t.value = ''; return;
  }
  if(t.id === 'locSel'){ syncForm(); const f = ui.form; if(!f.posTouched) f.pos = defaultPos(f.gymId, f.location, f.id); render(); return; }
  if(t.id === 'posSel'){ syncForm(); ui.form.posTouched = true; render(); return; }
  if(t.id === 'rFrom' || t.id === 'rTo'){ if(isDate(t.value)) ui.stats[t.id === 'rFrom' ? 'from' : 'to'] = t.value; render(); return; }
  if(t.id === 'visitDate'){ ui.date = isDate(t.value) ? t.value : today(); setNote(''); render(); return; }
  if(t.id === 'attempts'){ const n = parseInt(t.value, 10) || 0; setAttempts(id, ui.date, n); setNote(n > 0 ? `${plural(n,'attempt')} saved for this visit.` : 'Visit cleared.', 'good'); render(); return; }
  if(t.id === 'sent'){ setSent(id, ui.date, t.checked); setNote(t.checked ? 'Marked as sent on this visit.' : 'Send removed.', 'good'); render(); return; }
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const map = {newLocation:'addLocation', edName:'saveColour', newGym:'addGym', gymRename:'saveGymName', nameEdit:'renameSelf'};
  const act = map[e.target.id]; if(act){ e.preventDefault(); document.querySelector(`[data-act="${act}"]`)?.click(); }
});
window.addEventListener('online', updateChrome);
window.addEventListener('offline', updateChrome);

// ---------- start ----------
if(!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId){ phase = 'config'; render(); }
else {
  const app = initializeApp(FIREBASE_CONFIG);
  auth = getAuth(app);
  db = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})});
  getRedirectResult(auth).catch(e => { if(e && e.code) { setNote(`Sign-in didn't work (${e.code}).`, 'err'); render(); } });
  onAuthStateChanged(auth, u => {
    user = u; uid = u ? u.uid : null;
    if(!u){ unsubAll(); resetData(); phase = 'signedOut'; render(); return; }
    afterSignIn();
  });
}
</script>
</body>
</html>
