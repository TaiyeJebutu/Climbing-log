<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#1C2433; --muted:#5E6878; --soft:#AEB6C2; --line:#D5DAD3; --dot:rgba(28,36,51,.10);
  --focus:#2E9CCA; --danger:#C0392B; --ok:#2E8B57;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#151A23; --surface:#1E2530; --ink:#EEF0EC; --muted:#9AA3B2; --soft:#4A5466; --line:#2C3442; --dot:rgba(238,240,236,.07);
    --danger:#E8735F; --ok:#5CC98A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151A23; --surface:#1E2530; --ink:#EEF0EC; --muted:#9AA3B2; --soft:#4A5466; --line:#2C3442; --dot:rgba(238,240,236,.07);
  --danger:#E8735F; --ok:#5CC98A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  background-image:radial-gradient(var(--dot) 2px, transparent 2.5px);
  background-size:30px 30px; background-position:15px 15px;
  font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:20px 18px 48px}
h1{font-size:2rem; font-weight:800; letter-spacing:-.02em; margin:0}
h2{font-size:1.45rem; font-weight:800; letter-spacing:-.01em; margin:0}
h3{font-size:1.05rem; font-weight:600; margin:0 0 10px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

header{display:flex; align-items:center; justify-content:space-between; gap:12px}
.seg{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px; margin:18px 0 20px}
.seg button{flex:1; border:0; background:transparent; padding:9px 6px; border-radius:999px; font-weight:600; color:var(--muted)}
.seg button[aria-selected="true"], .seg button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}
.seg.inner{margin:0 0 14px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px}
.panel + .panel{margin-top:16px}
.section-title{margin:28px 4px 12px; font-size:1.3rem}
.btn{display:inline-block; border:1.5px solid var(--ink); background:transparent; border-radius:12px; padding:10px 16px; font-weight:600; text-align:center; cursor:pointer}
.btn.primary{background:var(--ink); color:var(--bg)}
.btn.danger{border-color:var(--danger); color:var(--danger)}
.btn.small{padding:6px 12px; font-size:.92rem; border-radius:10px}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btns{display:flex; flex-wrap:wrap; gap:10px}
.back{border:0; background:transparent; padding:4px 0; font-weight:600; color:var(--muted); margin-bottom:12px}

.field{display:block; font-weight:600; margin:0 0 18px}
.field > span{display:block; margin-bottom:8px}
input[type=text], input[type=date], input[type=number], select{
  width:100%; padding:11px 13px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg);
}
.inline{display:flex; gap:8px; margin-top:8px; align-items:center}
.inline input[type=text]{flex:1}

.note{margin-top:12px; min-height:1.4em; font-size:.95rem}
.note.err{color:var(--danger)}
.note.good{color:var(--ok)}

/* hold-shaped chips and swatches */
.chip{display:inline-grid; place-items:center; min-width:48px; height:40px; padding:0 8px; flex-shrink:0;
  background:var(--hc); color:var(--hf); text-shadow:var(--ts,none); font-weight:800;
  border-radius:46% 54% 41% 59% / 55% 43% 57% 45%;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.08)}
.chip.big{min-width:74px; height:62px; font-size:1.4rem}
.chip.tiny{min-width:26px; height:20px; padding:0; font-size:0}
.grades{display:grid; grid-template-columns:repeat(auto-fill,minmax(56px,1fr)); gap:8px}
.grades button{border:1.5px solid var(--line); background:var(--bg); border-radius:12px; padding:9px 0; font-weight:700}
.grades button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.swatches{display:flex; flex-wrap:wrap; gap:12px}
.swatch{border:0; background:transparent; padding:0; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.85rem; font-weight:600; width:66px; text-align:center; line-height:1.2}
.swatch i{display:block; width:48px; height:42px; background:var(--hc); border-radius:46% 54% 41% 59% / 55% 43% 57% 45%;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.16), 0 0 0 1px rgba(0,0,0,.1)}
.swatch[aria-pressed="true"] i{outline:3px solid var(--ink); outline-offset:3px}
.swatch.add i{background:transparent; box-shadow:none; border:2px dashed var(--muted); display:grid; place-items:center; font-style:normal; font-size:1.4rem; color:var(--muted)}
.editor{margin-top:14px; padding:14px; border:1.5px solid var(--line); border-radius:14px; background:var(--bg)}
.editor .shades{display:flex; flex-wrap:wrap; gap:12px; margin:10px 0 12px; align-items:center}
.editor .shade{display:flex; align-items:center; gap:4px}
.editor input[type=color]{width:52px; height:44px; padding:2px; border:1.5px solid var(--line); border-radius:10px; background:var(--surface); cursor:pointer}
.preview{display:flex; align-items:center; gap:10px; margin-bottom:12px}

.filters{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0 4px}
.filters select{padding:8px 10px; font-size:.92rem}
@media (max-width:560px){ .filters{grid-template-columns:1fr 1fr} }
.loc{margin:20px 0 6px; font-weight:600; color:var(--muted); font-size:.95rem}
.routes{list-style:none; margin:0; padding:0}
.routes li + li{border-top:1px solid var(--line)}
.rrow{width:100%; display:flex; align-items:center; gap:14px; border:0; background:transparent; padding:10px 2px; text-align:left}
.rrow .t{flex:1; min-width:0}
.rrow .t strong{display:block; font-weight:600}
.no{color:var(--muted); font-weight:600}
.st{font-size:.92rem; font-weight:600; text-align:right}
.st.none{color:var(--muted); font-weight:400}

.route-head{display:flex; gap:16px; align-items:center; justify-content:space-between}
.route-head .who{display:flex; gap:16px; align-items:center}
.counter{display:grid; grid-template-columns:52px 1fr 88px; gap:8px; align-items:stretch}
.counter button{border:1.5px solid var(--ink); background:transparent; border-radius:12px; font-weight:800; font-size:1.2rem}
.counter .plus{background:var(--ink); color:var(--bg)}
.counter input{text-align:center; font-size:1.3rem; font-weight:800}
.check{display:flex; align-items:center; gap:10px; margin-top:14px; font-weight:600}
.check input{width:22px; height:22px; accent-color:var(--ink)}
.visits{list-style:none; margin:0; padding:0}
.visits li{display:flex; align-items:center; gap:10px; border-top:1px solid var(--line)}
.visits li:first-child{border-top:0}
.visits .v{flex:1; border:0; background:transparent; text-align:left; padding:10px 2px; display:flex; justify-content:space-between; gap:10px}
.visits .v[aria-current="true"]{font-weight:700}
.badge{display:inline-block; font-size:.8rem; font-weight:700; padding:1px 8px; border-radius:99px; background:var(--ink); color:var(--bg)}
.x{border:0; background:transparent; color:var(--muted); padding:6px 8px; border-radius:8px; font-size:.9rem}
.x.armed{color:var(--danger); font-weight:600}

.confirm{border:2px solid var(--ink)}
.confirm ul{margin:8px 0 14px; padding-left:20px}
.empty{text-align:center; padding:28px 14px}
.empty p{margin-bottom:14px}
.filebtn input{position:absolute; width:1px; height:1px; opacity:0}
.filebtn:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.others{list-style:none; margin:0; padding:0}
.others li{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line)}
.others li:first-child{border-top:0}
.warn{background:var(--danger); color:#fff; padding:10px 14px; border-radius:12px; margin-bottom:14px}

/* stats */
.periods{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.periods button{border:1.5px solid var(--line); background:var(--bg); border-radius:10px; padding:7px 4px; font-weight:600; font-size:.9rem}
.periods button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.range{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
.range label{font-weight:600; font-size:.9rem}
.big-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px}
.big-stats b{display:block; font-size:1.5rem; font-weight:800; line-height:1.15}
.bars .row{display:grid; grid-template-columns:44px 1fr auto; align-items:center; gap:10px; margin:5px 0}
.bars.wide .row{grid-template-columns:minmax(80px,32%) 1fr auto}
.bars.wide .lab{text-align:left; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bars .lab{text-align:right; font-weight:600; font-size:.9rem}
.bars .val{font-size:.88rem; color:var(--muted); min-width:64px; text-align:right}
.track{height:18px; background:var(--bg); border-radius:6px; overflow:hidden; display:flex}
.track span{display:block; height:100%}
.track .a{background:var(--ink)}
.track .b{background:var(--soft)}
.pyr .track{background:transparent; justify-content:center}
.pyr .track > div{display:flex; height:100%; border-radius:6px; overflow:hidden}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.88rem; margin-top:10px}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px}
.legend i.a{background:var(--ink)} .legend i.b{background:var(--soft)}
.scroll{overflow-x:auto}
.chart svg{display:block; height:auto}
table.grid{border-collapse:collapse; width:100%; font-size:.9rem}
table.grid th, table.grid td{padding:7px 8px; border-top:1px solid var(--line); text-align:left; white-space:nowrap}
table.grid thead th{border-top:0; color:var(--muted); font-weight:600}
table.grid td.r{text-align:right}
.mini{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px}
.mini h4{margin:0 0 6px; font-size:1rem}
.plain{list-style:none; margin:0; padding:0}
.plain li{display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-top:1px solid var(--line)}
.plain li:first-child{border-top:0}
.dim{color:var(--muted)}
@media (max-width:420px){ .wrap{padding:14px 12px 40px} h1{font-size:1.7rem} .panel{padding:16px} .seg button{font-size:.92rem} }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Route log</h1><span class="muted" id="who"></span></header>
  <nav class="seg" role="tablist" aria-label="Sections" id="tabs">
    <button role="tab" data-tab="routes">Routes</button>
    <button role="tab" data-tab="stats">Stats</button>
    <button role="tab" data-tab="archive">Archive</button>
    <button role="tab" data-tab="files">Files</button>
  </nav>
  <main id="view"></main>
</div>

<script>
(() => {
  // ---------- constants ----------
  const GRADES = ['VB','V0','V1','V2','V3','V4','V5','V6','V7','V8','V9','V10'];
  const HEX = {red:'#E4572E',orange:'#F28C28',yellow:'#F2C230',green:'#3BB273',blue:'#2E9CCA',purple:'#8E44AD',
    pink:'#E86A9E',black:'#1E2229',white:'#F7F7F4'};
  const DEF_COLOURS = ['Red','Orange','Yellow','Green','Blue','Purple','Pink','Black','White'];
  const GREY = '#8A929E';
  const STATUS = {none:'Not tried', working:'Working on it', sent:'Sent', flash:'Flashed'};
  const KEY = 'routelog.v1';
  const MAX_SHADES = 3;

  // ---------- helpers ----------
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rid = () => 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  const pad = n => String(n).padStart(2,'0');
  const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const today = () => dstr(new Date());
  const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
  const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return dstr(d); };
  const isDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  const fmtDate = s => parseD(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const fmtShort = s => parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
  const fmtMonth = s => parseD(s).toLocaleDateString(undefined,{month:'short',year:'2-digit'});
  const fmtStamp = t => t ? new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) : 'never';
  const isHex = h => typeof h === 'string' && /^#[0-9a-f]{6}$/i.test(h);
  const lum = h => { const n = parseInt(h.slice(1),16); return (0.299*(n>>16) + 0.587*((n>>8)&255) + 0.114*(n&255))/255; };
  const gIdx = g => { const i = GRADES.indexOf(g); return i < 0 ? 99 : i; };
  const str = (v, max=60) => typeof v === 'string' && v.trim() ? v.trim().slice(0,max) : null;
  const pct = (a,b) => b ? Math.round(a/b*100) : 0;
  const plural = (n, w) => `${n} ${w}${n===1?'':'s'}`;

  // ---------- state ----------
  let storageOk = true;
  function load(){
    try{ const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }catch(e){ storageOk = false; return null; }
  }
  let S = load() || {};
  S.name ??= ''; S.routes ??= {}; S.colours ??= DEF_COLOURS.slice(); S.locations ??= [];
  S.log ??= {}; S.others ??= {}; S.lastExport ??= {routes:null, results:null};

  // migrate colours from plain names to {name, shades}
  S.colours = S.colours.map(c => typeof c === 'string' ? {name:c, shades:[HEX[c.toLowerCase()] || GREY]} : c)
    .filter(c => c && str(c.name)).map(c => ({name:c.name, shades:(c.shades||[]).filter(isHex).slice(0,MAX_SHADES)}))
    .map(c => c.shades.length ? c : {name:c.name, shades:[GREY]});

  // migrate / repair route order
  function normalizeOrder(){
    const active = Object.values(S.routes).filter(r => !r.archived);
    const activeIds = new Set(active.map(r => r.id));
    const seen = new Set();
    let order = (Array.isArray(S.order) ? S.order : []).filter(id => activeIds.has(id) && !seen.has(id) && seen.add(id));
    const missing = active.filter(r => !seen.has(r.id));
    if(missing.length){
      const locIdx = l => { const i = S.locations.indexOf(l); return i < 0 ? 999 : i; };
      missing.sort((a,b) => locIdx(a.location)-locIdx(b.location) || gIdx(a.grade)-gIdx(b.grade) || a.colour.localeCompare(b.colour));
      order = order.concat(missing.map(r => r.id));
    }
    S.order = order;
  }
  Object.values(S.routes).forEach(r => { if(r.addedOn === undefined) r.addedOn = null; });
  normalizeOrder();

  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOk = true; }catch(e){ storageOk = false; }
  }
  save();
  let askedPersist = false;
  function askPersist(){
    if(askedPersist) return; askedPersist = true;
    try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  }

  const ui = {
    tab:'routes', screen:null, date:today(),
    filters:{grade:'', colour:'', location:'', status:''},
    form:null, pending:null, note:'', noteKind:'', armed:null,
    stats:{mode:'current', preset:'1m', from:addDays(today(),-30), to:today()}
  };
  function setNote(text, kind){ ui.note = text; ui.noteKind = kind || ''; }
  function arm(key){
    ui.armed = key; render();
    setTimeout(() => { if(ui.armed === key){ ui.armed = null; render(); } }, 3000);
  }

  // ---------- colours ----------
  const colourObj = name => S.colours.find(c => c.name.toLowerCase() === String(name).toLowerCase());
  function paint(shades){
    if(shades.length === 1) return shades[0];
    const step = 100 / shades.length;
    return `linear-gradient(135deg, ${shades.map((h,i) => `${h} ${i*step}% ${(i+1)*step}%`).join(', ')})`;
  }
  function hcShades(shades){
    if(shades.length === 1) return `--hc:${shades[0]};--hf:${lum(shades[0]) > .6 ? '#1C2433' : '#fff'}`;
    return `--hc:${paint(shades)};--hf:#fff;--ts:0 0 3px rgba(0,0,0,.85), 0 0 1px rgba(0,0,0,.9)`;
  }
  const hc = name => hcShades((colourObj(name) || {shades:[GREY]}).shades);

  // ---------- routes ----------
  const numOf = id => S.order.indexOf(id) + 1;
  const numText = r => r.archived ? (r.lastNumber ? `was #${r.lastNumber}` : 'archived') : `#${numOf(r.id)}`;
  const label = r => `${esc(r.colour)} ${esc(r.grade)}`;
  const fullLabel = r => `${numText(r)} ${label(r)}`;
  function placeAt(id, pos){
    S.order = S.order.filter(x => x !== id);
    if(pos === 'start') S.order.unshift(id);
    else if(pos && pos.startsWith('after:')){
      const i = S.order.indexOf(pos.slice(6));
      if(i < 0) S.order.push(id); else S.order.splice(i+1, 0, id);
    } else S.order.push(id);
  }
  function defaultPos(location, exclude){
    const ids = S.order.filter(id => id !== exclude);
    for(let i = ids.length-1; i >= 0; i--) if(S.routes[ids[i]].location === location) return 'after:' + ids[i];
    return ids.length ? 'after:' + ids[ids.length-1] : 'start';
  }
  function currentPos(id){ const i = S.order.indexOf(id); return i <= 0 ? 'start' : 'after:' + S.order[i-1]; }
  function archiveRoute(r, on){
    r.lastNumber = numOf(r.id) || r.lastNumber || null;
    r.archived = true; r.archivedOn = on || today();
    S.order = S.order.filter(x => x !== r.id);
  }

  // ---------- log & status ----------
  const sortByDate = (a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  const visitsIn = (log, id) => (log[id] || []).filter(e => e.attempts > 0).sort(sortByDate);
  const visits = id => visitsIn(S.log, id);
  function summary(log, id){
    const es = visitsIn(log, id);
    if(!es.length) return null;
    let run = 0, sent = null;
    for(const e of es){ run += e.attempts; if(e.sent){ sent = {date:e.date, toSend:run, flash:run===1}; break; } }
    return {es, sent, total: es.reduce((n,e) => n + e.attempts, 0), first: es[0].date};
  }
  function status(id){
    const s = summary(S.log, id);
    if(!s) return {kind:'none'};
    if(s.sent) return {kind: s.sent.flash ? 'flash' : 'sent', toSend: s.sent.toSend, visits: s.es.length};
    return {kind:'working', total: s.total, visits: s.es.length};
  }
  function statusText(st, long){
    if(st.kind === 'none') return long ? 'Not tried yet' : STATUS.none;
    if(st.kind === 'flash') return long ? 'Flashed, sent on the first attempt' : STATUS.flash;
    if(st.kind === 'sent') return long ? `Sent in ${st.toSend} attempts` : `Sent in ${st.toSend}`;
    return long ? `Working on it, ${plural(st.total,'attempt')} over ${plural(st.visits,'visit')}` : `Working on it, ${st.total}`;
  }
  const entry = (id, date) => (S.log[id] || []).find(e => e.date === date);
  function setEntry(id, date, attempts, sent){
    attempts = Math.max(0, Math.min(999, Math.floor(attempts) || 0));
    if(sent && attempts < 1) attempts = 1;
    let list = (S.log[id] || []).filter(e => e.date !== date);
    if(attempts > 0) list.push({date, attempts, sent: !!sent});
    if(list.length) S.log[id] = list; else delete S.log[id];
    save(); askPersist();
  }

  // ---------- files ----------
  function download(filename, obj){
    const blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  async function shareFile(filename, obj){
    const file = new File([JSON.stringify(obj, null, 2)], filename, {type:'application/json'});
    try{ await navigator.share({files:[file], title: filename}); return true; }
    catch(e){ return false; }
  }
  const canShareFiles = (() => {
    try{ return !!(navigator.canShare && navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]})); }catch(e){ return false; }
  })();
  const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'climber';

  function routesFile(){
    return {type:'route-log/routes', version:2, exportedAt:new Date().toISOString(),
      colours:S.colours, locations:S.locations,
      routes:S.order.map(id => { const r = S.routes[id]; return {id:r.id, grade:r.grade, colour:r.colour, location:r.location, addedOn:r.addedOn || null}; })};
  }
  function resultsFile(){
    const routes = {};
    Object.keys(S.log).forEach(id => { const r = S.routes[id]; if(r) routes[id] = {grade:r.grade, colour:r.colour, location:r.location}; });
    return {type:'route-log/results', version:2, name:S.name, exportedAt:new Date().toISOString(), log:S.log, routes};
  }
  function cleanLog(log){
    const out = {};
    if(!log || typeof log !== 'object') return out;
    Object.entries(log).forEach(([id, list]) => {
      if(!Array.isArray(list)) return;
      const seen = new Set();
      const es = list.filter(e => e && isDate(e.date) && Number.isFinite(+e.attempts) && +e.attempts >= 1 && !seen.has(e.date) && seen.add(e.date))
        .map(e => ({date:e.date, attempts:Math.min(999, Math.floor(+e.attempts)), sent:!!e.sent}));
      if(es.length) out[String(id)] = es;
    });
    return out;
  }

  function readImport(file){
    const reader = new FileReader();
    reader.onload = () => {
      let data;
      try{ data = JSON.parse(reader.result); }catch(e){ setNote('That file couldn\'t be read. Pick a .json file exported from Route log.', 'err'); render(); return; }
      if(data && data.type === 'route-log/routes') prepareRoutes(data);
      else if(data && data.type === 'route-log/results') prepareResults(data);
      else setNote('That file wasn\'t made by Route log. Pick a route file or a results file exported from this app.', 'err');
      render();
    };
    reader.onerror = () => { setNote('That file couldn\'t be opened. Try picking it again.', 'err'); render(); };
    reader.readAsText(file);
  }
  function prepareRoutes(data){
    const seen = new Set();
    const incoming = (Array.isArray(data.routes) ? data.routes : [])
      .map(r => r && ({id:str(r.id), grade:str(r.grade), colour:str(r.colour), location:str(r.location), addedOn: isDate(r?.addedOn) ? r.addedOn : null}))
      .filter(r => r && r.id && r.grade && r.colour && r.location && !seen.has(r.id) && seen.add(r.id));
    const ids = new Set(incoming.map(r => r.id));
    const added = [], changed = [], archived = [];
    incoming.forEach(r => {
      const l = S.routes[r.id];
      if(!l) added.push(r);
      else if(l.archived || l.grade !== r.grade || l.colour !== r.colour || l.location !== r.location) changed.push(r);
    });
    S.order.forEach(id => { if(!ids.has(id)) archived.push(S.routes[id]); });
    const common = S.order.filter(id => ids.has(id));
    const incCommon = incoming.map(r => r.id).filter(id => common.includes(id));
    const reordered = common.some((id,i) => incCommon[i] !== id);
    const colours = (Array.isArray(data.colours) ? data.colours : []).map(c => {
      if(typeof c === 'string') return str(c) ? {name:str(c), shades:null} : null;
      if(!c || !str(c.name)) return null;
      const shades = (Array.isArray(c.shades) ? c.shades : []).filter(isHex).slice(0, MAX_SHADES);
      return {name:str(c.name), shades: shades.length ? shades : null};
    }).filter(Boolean);
    ui.pending = {kind:'routes', incoming, added, changed, archived, reordered, colours,
      locations:(data.locations||[]).map(l => str(l)).filter(Boolean), exportedAt:data.exportedAt};
    setNote('');
  }
  function applyRoutes(p){
    p.archived.forEach(r => archiveRoute(r));
    p.incoming.forEach(r => {
      const l = S.routes[r.id];
      if(!l) S.routes[r.id] = {id:r.id, grade:r.grade, colour:r.colour, location:r.location, addedOn:r.addedOn, archived:false};
      else Object.assign(l, {grade:r.grade, colour:r.colour, location:r.location, addedOn:r.addedOn ?? l.addedOn ?? null, archived:false, archivedOn:null});
    });
    S.order = p.incoming.map(r => r.id);
    p.colours.forEach(c => {
      const ex = colourObj(c.name);
      if(ex){ if(c.shades) ex.shades = c.shades; }
      else S.colours.push({name:c.name, shades: c.shades || [HEX[c.name.toLowerCase()] || GREY]});
    });
    p.incoming.forEach(r => { if(!colourObj(r.colour)) S.colours.push({name:r.colour, shades:[HEX[r.colour.toLowerCase()] || GREY]}); });
    [...p.locations, ...p.incoming.map(r => r.location)].forEach(l => { if(!S.locations.some(x => x.toLowerCase() === l.toLowerCase())) S.locations.push(l); });
    normalizeOrder(); save(); askPersist();
    setNote(`Route list updated: ${p.added.length} added, ${p.changed.length} changed, ${p.archived.length} moved to the archive.`, 'good');
  }
  function prepareResults(data){
    const name = str(data.name, 40) || 'Unnamed climber';
    const log = cleanLog(data.log);
    const routes = data.routes && typeof data.routes === 'object' ? data.routes : {};
    ui.pending = {kind:'results', name, log, routes, exportedAt:data.exportedAt,
      visits:Object.values(log).reduce((n,l) => n + l.length, 0), routeCount:Object.keys(log).length};
    setNote('');
  }
  function restoreResults(p){
    S.log = JSON.parse(JSON.stringify(p.log));
    let restored = 0;
    Object.keys(S.log).forEach(id => {
      if(S.routes[id]) return;
      const r = p.routes[id] || {};
      S.routes[id] = {id, grade:str(r.grade)||'?', colour:str(r.colour)||'Unknown', location:str(r.location)||'Unknown', addedOn:null, archived:true, archivedOn:null, lastNumber:null};
      restored++;
    });
    save(); askPersist();
    setNote(`Your log was restored.${restored ? ` ${restored} route${restored===1?' was':'s were'} not in your route list, so ${restored===1?'it is':'they are'} in the archive until you import a route file that includes ${restored===1?'it':'them'}.` : ''}`, 'good');
  }
  function storeOthers(p){
    S.others[p.name] = {name:p.name, exportedAt:p.exportedAt || null, log:p.log};
    save();
    setNote(`Saved ${p.name}'s results for the group stats.`, 'good');
  }

  // ---------- views: routes ----------
  const view = document.getElementById('view');

  function renderWelcome(){
    return `<section class="panel">
      <h2>Welcome</h2>
      <p class="muted" style="margin:8px 0 18px">Enter your name. It's added to your results file so your group can tell whose results are whose.</p>
      <label class="field"><span>Your name</span><input type="text" id="nameInput" maxlength="40" autocomplete="name"></label>

    const active = S.order.map(id => S.routes[id]);

    shown.forEach(r => {

    return `<section class="panel">

    </section>`;
  }

  function renderArchive(){
    const list = Object.values(S.routes).filter(r => r.archived)

    return `<button class="back" data-act="back">‹ Back</button>

      <section class="panel"><h3>Visits</h3>
        ${es.length ? `<ul class="visits">${es.map(v => `<li>
          <button class="v num" data-pick="${esc(v.date)}" ${v.date===ui.date && !r.archived?'aria-current="true"':''} ${r.archived?'disabled':''}>

          </li>`).join('')}</ul>` : `<p class="muted">No visits logged yet.</p>`}

      <span style="font-weight:600">Shade${ed.shades.length>1?'s':''}</span>

        <div class="field" style="margin-top:-8px">

          ${editing ? '' : `<button class="btn" data-act="saveAnother">Save and add another</button>`}

  // ---------- stats ----------
  function statsView(){
    const s = ui.stats;
    if(s.mode !== 'period') return {mode:s.mode, range:false};
    let from = s.from, to = s.to;
    if(s.preset === '1m'){ to = today(); from = addDays(to,-30); }
    else if(s.preset === '3m'){ to = today(); from = addDays(to,-91); }
    else if(s.preset === 'year'){ to = today(); from = `${to.slice(0,4)}-01-01`; }
    if(from > to) [from, to] = [to, from];
    return {mode:'period', range:true, from, to};
  }
  const inRange = (d, V) => !V.range || (d >= V.from && d <= V.to);
  function routeSet(V){
    const active = S.order.map(id => S.routes[id]);
    const archived = Object.values(S.routes).filter(r => r.archived).sort((a,b) => (a.lastNumber||999)-(b.lastNumber||999));
    if(V.mode === 'current') return active;
    const all = active.concat(archived);
    if(V.mode === 'lifetime') return all;
    return all.filter(r => (!r.addedOn || r.addedOn <= V.to) && (!r.archivedOn || r.archivedOn >= V.from));
  }
  // one person's result on one route, within the view
  function info(log, id, V){
    const s = summary(log, id);
    if(!s) return {tried:false, attempts:0, sent:null, project:false, firstInView:false};
    const es = V.range ? s.es.filter(e => inRange(e.date, V)) : s.es;
    const attempts = es.reduce((n,e) => n + e.attempts, 0);
    const sent = s.sent && inRange(s.sent.date, V) ? s.sent : null;
    const sentBy = s.sent && (!V.range || s.sent.date <= V.to);
    return {tried: attempts > 0, attempts, sent, project: attempts > 0 && !sentBy, firstInView: inRange(s.first, V), sentEverByEnd: !!sentBy};
  }
  function people(){
    return [{name:S.name, you:true, log:S.log}].concat(Object.values(S.others).sort((a,b) => a.name.localeCompare(b.name)).map(o => ({name:o.name, log:o.log})));
  }
  const personLabel = p => p.you ? `${esc(p.name)} (you)` : esc(p.name);

  function pyramidHtml(routes, log, V, maxOverride){
    const rows = GRADES.map(g => {
      let f = 0, s = 0;
      routes.forEach(r => { if(r.grade !== g) return; const i = info(log, r.id, V); if(i.sent){ i.sent.flash ? f++ : s++; } });
      return {g, f, s};
    });
    const used = rows.filter(r => r.f + r.s);
    if(!used.length) return `<p class="muted">No sends ${V.range ? 'in this period' : 'yet'}.</p>`;
    const lo = gIdx(used[0].g), hi = gIdx(used[used.length-1].g);
    const max = maxOverride || Math.max(...used.map(r => r.f + r.s));
    return `<div class="bars pyr">${rows.filter(r => gIdx(r.g) >= lo && gIdx(r.g) <= hi).reverse().map(r => {
      const tot = r.f + r.s;
      return `<div class="row"><span class="lab num">${r.g}</span>
        <div class="track"><div style="width:${tot/max*100}%">${r.f?`<span class="a" style="flex:${r.f}"></span>`:''}${r.s?`<span class="b" style="flex:${r.s}"></span>`:''}</div></div>
        <span class="val num">${tot}</span></div>`;
    }).join('')}</div>`;
  }
  const legendFS = `<div class="legend muted"><span><i class="a"></i>Flashed</span><span><i class="b"></i>Sent after more attempts</span></div>`;

  function barRows(items, cls){ // [{lab, a, b, max, val}]
    return `<div class="bars ${cls||''}">${items.map(it => `<div class="row"><span class="lab num">${esc(it.lab)}</span>
      <div class="track">${it.a?`<span class="a" style="width:${it.a/it.max*100}%"></span>`:''}${it.b?`<span class="b" style="width:${it.b/it.max*100}%"></span>`:''}</div>
      <span class="val num">${it.val}</span></div>`).join('')}</div>`;
  }

  function activityChart(V){
    const dates = {};
    Object.keys(S.log).forEach(id => {
      if(!S.routes[id]) return;
      (S.log[id] || []).forEach(e => {
        if(!inRange(e.date, V) || e.attempts < 1) return;
        if(V.mode === 'current' && S.routes[id].archived) return;
        const d = dates[e.date] || (dates[e.date] = {att:0, sends:0});
        d.att += e.attempts; if(e.sent) d.sends++;
      });
    });
    // count only first sends
    Object.keys(dates).forEach(k => dates[k].sends = 0);
    Object.keys(S.log).forEach(id => {
      const r = S.routes[id]; if(!r || (V.mode === 'current' && r.archived)) return;
      const s = summary(S.log, id); if(s && s.sent && dates[s.sent.date]) dates[s.sent.date].sends++;
    });
    const keys = Object.keys(dates).sort();
    if(!keys.length) return `<p class="muted">No visits ${V.range ? 'in this period' : 'yet'}.</p>`;
    const start = V.range ? V.from : keys[0], end = V.range ? V.to : keys[keys.length-1];
    const spanDays = (parseD(end) - parseD(start)) / 864e5;
    let buckets;
    if(spanDays <= 62){
      buckets = keys.map(k => ({lab:fmtShort(k), ...dates[k]}));
    } else {
      const m = {};
      keys.forEach(k => { const mk = k.slice(0,7); const b = m[mk] || (m[mk] = {att:0, sends:0}); b.att += dates[k].att; b.sends += dates[k].sends; });
      buckets = [];
      let cur = parseD(start.slice(0,7) + '-01'); const last = end.slice(0,7);
      while(true){ const mk = dstr(cur).slice(0,7); buckets.push({lab:fmtMonth(mk+'-01'), ...(m[mk] || {att:0, sends:0})}); if(mk >= last) break; cur.setMonth(cur.getMonth()+1); }
    }
    const max = Math.max(1, ...buckets.map(b => b.att));
    const bw = 44, H = 200, top = 16, bottom = 36, W = Math.max(320, buckets.length * bw + 36);
    const y = v => top + (H - top - bottom) * (1 - v / max);
    const ticks = [0, Math.ceil(max/2), max].filter((v,i,a) => a.indexOf(v) === i);
    const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="Attempts and sends ${spanDays <= 62 ? 'per visit date' : 'per month'}">
      ${ticks.map(t => `<line x1="30" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="24" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${t}</text>`).join('')}
      ${buckets.map((b,i) => { const x = 36 + i*bw;
        return `<rect x="${x}" y="${y(b.att)}" width="16" height="${y(0)-y(b.att)}" rx="3" fill="var(--soft)"><title>${esc(b.lab)}: ${plural(b.att,'attempt')}</title></rect>
        <rect x="${x+18}" y="${y(b.sends)}" width="16" height="${y(0)-y(b.sends)}" rx="3" fill="var(--ink)"><title>${esc(b.lab)}: ${plural(b.sends,'send')}</title></rect>
        <text x="${x+17}" y="${H-bottom+16}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(b.lab)}</text>`; }).join('')}
    </svg>`;
    return `<div class="scroll chart">${svg}</div>
      <div class="legend muted"><span><i class="b"></i>Attempts</span><span><i class="a"></i>New sends</span><span>${spanDays <= 62 ? 'Per visit date' : 'Per month'}</span></div>`;
  }

  function cellText(i){
    if(i.sent) return i.sent.flash ? 'Flashed' : `Sent in ${i.sent.toSend}`;
    if(i.tried) return `Trying, ${i.attempts}`;
    return '<span class="dim">–</span>';
  }

  function renderStats(){
    const V = statsView(), s = ui.stats;
    const routes = routeSet(V);
    const me = S.log;
    const P = people();
    const rlab = r => `${esc(numText(r))} ${label(r)}`;

    const modeSwitch = `<section class="panel">
      <div class="seg inner" role="group" aria-label="Stats covering">
        <button data-smode="current" aria-pressed="${s.mode==='current'}">Current gym</button>
        <button data-smode="lifetime" aria-pressed="${s.mode==='lifetime'}">Lifetime</button>
        <button data-smode="period" aria-pressed="${s.mode==='period'}">Time period</button></div>
      ${s.mode === 'period' ? `<div class="periods" role="group" aria-label="Period">
          ${[['1m','Last month'],['3m','Last 3 months'],['year','This year'],['custom','Custom']].map(([k,t]) => `<button data-preset="${k}" aria-pressed="${s.preset===k}">${t}</button>`).join('')}</div>
        ${s.preset === 'custom' ? `<div class="range"><label>From<input type="date" id="rFrom" value="${esc(s.from)}" max="${today()}"></label><label>To<input type="date" id="rTo" value="${esc(s.to)}" max="${today()}"></label></div>`
          : `<p class="muted small" style="margin-top:10px">${esc(fmtDate(V.from))} to ${esc(fmtDate(V.to))}</p>`}` : ''}
      <p class="muted small" style="margin-top:10px">${s.mode === 'current' ? `Covers the ${plural(routes.length,'route')} on the walls now.`
        : s.mode === 'lifetime' ? `Covers all ${plural(routes.length,'route')} you have, archived ones included.`
        : `Covers attempts and sends made in this period, on the ${plural(routes.length,'route')} that were on the walls at some point during it.`}</p>
    </section>`;

    if(!routes.length) return modeSwitch + `<section class="panel empty"><p>No routes to show stats for yet.</p></section>`;

    // ---- personal ----
    const mine = routes.map(r => ({r, i:info(me, r.id, V)}));
    const sends = mine.filter(x => x.i.sent);
    const flashes = sends.filter(x => x.i.sent.flash);
    const hardest = list => list.slice().sort((a,b) => gIdx(b.r.grade)-gIdx(a.r.grade))[0];
    const hs = hardest(sends), hf = hardest(flashes);
    const gradesInSet = GRADES.filter(g => routes.some(r => r.grade === g));
    const completion = gradesInSet.map(g => {
      const inG = mine.filter(x => x.r.grade === g);
      const f = inG.filter(x => x.i.sent && x.i.sent.flash).length, sn = inG.filter(x => x.i.sent && !x.i.sent.flash).length;
      return {lab:g, a:f, b:sn, max:inG.length, val:`${f+sn} of ${inG.length}`};
    });
    const locs = [...new Set(routes.map(r => r.location))];
    const locCompletion = locs.map(l => {
      const inL = mine.filter(x => x.r.location === l);
      const done = inL.filter(x => x.i.sent).length;
      return {l, done, total:inL.length};
    });
    const avgAtt = gradesInSet.map(g => {
      const sg = sends.filter(x => x.r.grade === g);
      return {g, n:sg.length, avg: sg.length ? sg.reduce((n,x) => n + x.i.sent.toSend, 0) / sg.length : null};
    }).filter(x => x.n);
    const maxAvg = Math.max(1, ...avgAtt.map(x => x.avg));
    const flashRate = gradesInSet.map(g => {
      const tried = mine.filter(x => x.r.grade === g && x.i.tried && x.i.firstInView);
      const f = tried.filter(x => x.i.sent && x.i.sent.flash).length;
      return {g, f, t:tried.length};
    }).filter(x => x.t);
    const projects = mine.filter(x => x.i.project).sort((a,b) => b.i.attempts - a.i.attempts);

    const personal = `<h2 class="section-title">You</h2>
      <section class="panel"><div class="big-stats num">
        <div><b>${sends.length}</b><span class="muted">sends, ${flashes.length} flashed</span></div>
        <div><b>${hs ? esc(hs.r.grade) : '–'}</b><span class="muted">hardest send${hs ? `, ${rlab(hs.r)}` : ''}</span></div>
        <div><b>${hf ? esc(hf.r.grade) : '–'}</b><span class="muted">hardest flash${hf ? `, ${rlab(hf.r)}` : ''}</span></div>
      </div></section>
      <section class="panel"><h3>Grade pyramid</h3>${pyramidHtml(routes, me, V)}${sends.length ? legendFS : ''}</section>
      <section class="panel"><h3>Completion by grade</h3>${barRows(completion)}${legendFS}</section>
      <section class="panel"><h3>Completion by location</h3>
        ${barRows(locCompletion.map(x => ({lab:x.l, a:x.done, b:0, max:x.total, val:`${x.done} of ${x.total}`})), 'wide')}
      </section>
      <section class="panel"><h3>Average attempts to send</h3>
        ${avgAtt.length ? barRows(avgAtt.map(x => ({lab:x.g, a:x.avg, b:0, max:maxAvg, val:`${x.avg.toFixed(1)} (${x.n})`})))
          + `<p class="muted small" style="margin-top:8px">Number of sends in brackets.</p>` : `<p class="muted">No sends ${V.range ? 'in this period' : 'yet'}.</p>`}</section>
      <section class="panel"><h3>Flash rate by grade</h3>
        ${flashRate.length ? barRows(flashRate.map(x => ({lab:x.g, a:x.f, b:0, max:x.t, val:`${x.f} of ${x.t}, ${pct(x.f,x.t)}%`})))
          + `<p class="muted small" style="margin-top:8px">Flashed out of routes first tried${V.range ? ' in this period' : ''}.</p>` : `<p class="muted">No routes tried ${V.range ? 'in this period' : 'yet'}.</p>`}</section>
      <section class="panel"><h3>Current projects</h3>
        ${projects.length ? `<ul class="plain">${projects.map(x => `<li><span>${rlab(x.r)} <span class="muted">${esc(x.r.location)}</span></span><span class="num">${plural(x.i.attempts,'attempt')}</span></li>`).join('')}</ul>`
          : `<p class="muted">No unsent routes ${V.range ? 'tried in this period' : 'being worked on'}.</p>`}</section>
      <section class="panel"><h3>Activity</h3>${activityChart(V)}</section>`;

    // ---- group ----
    if(P.length < 2) return modeSwitch + personal + `<h2 class="section-title">Group</h2>
      <section class="panel empty"><p>Import results files from others in the Files tab to see group stats.</p><button class="btn" data-tab="files">Go to Files</button></section>`;

    const grid = routes.map(r => ({r, cells: P.map(p => info(p.log, r.id, V))}));
    const touched = grid.filter(g => g.cells.some(c => c.tried || c.sent));
    const routeView = `<section class="panel"><h3>Route view</h3>
      ${touched.length ? `<div class="scroll"><table class="grid num"><thead><tr><th>Route</th>${P.map(p => `<th>${personLabel(p)}</th>`).join('')}</tr></thead>
        <tbody>${touched.map(g => `<tr><td><span class="chip tiny" style="${hc(g.r.colour)}"></span> ${rlab(g.r)}</td>${g.cells.map(c => `<td>${cellText(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
        : `<p class="muted">Nobody has logged anything ${V.range ? 'in this period' : 'yet'}.</p>`}</section>`;

    const groupComp = gradesInSet.map(g => {
      const inG = grid.filter(x => x.r.grade === g);
      const anyone = inG.filter(x => x.cells.some(c => c.sent)).length;
      const halfers = P.filter((p,pi) => inG.filter(x => x.cells[pi].sent).length * 2 >= inG.length && inG.length).length;
      return {g, anyone, total:inG.length, halfers};
    });
    const groupCompHtml = `<section class="panel"><h3>Group completion by grade</h3>
      <div class="scroll"><table class="grid num"><thead><tr><th>Grade</th><th class="r">Sent by anyone</th><th class="r">Climbers with ½+ sent</th></tr></thead>
      <tbody>${groupComp.map(x => `<tr><td>${x.g}</td><td class="r">${x.anyone} of ${x.total}</td><td class="r">${x.halfers} of ${P.length}</td></tr>`).join('')}</tbody></table></div></section>`;

    const tough = touched.map(g => {
      const senders = g.cells.filter(c => c.sent);
      const triers = g.cells.filter(c => c.tried || c.sent).length;
      return {r:g.r, senders:senders.length, triers, avg: senders.length ? senders.reduce((n,c) => n + c.sent.toSend, 0) / senders.length : null,
        attempts: g.cells.reduce((n,c) => n + c.attempts, 0)};
    });
    const byAvg = tough.filter(t => t.avg !== null && t.avg > 1).sort((a,b) => b.avg - a.avg).slice(0,8);
    const byFew = tough.slice().sort((a,b) => a.senders/a.triers - b.senders/b.triers || b.attempts - a.attempts).slice(0,8);
    const toughHtml = `<section class="panel"><h3>Toughest routes</h3>
      <div class="mini">
        <div><h4>Most attempts per send</h4>${byAvg.length ? `<ul class="plain">${byAvg.map(t => `<li><span>${rlab(t.r)}</span><span class="num">${t.avg.toFixed(1)}</span></li>`).join('')}</ul>` : '<p class="muted">No sends yet.</p>'}</div>
        <div><h4>Fewest climbers have topped</h4><ul class="plain">${byFew.map(t => `<li><span>${rlab(t.r)}</span><span class="num">${t.senders} of ${t.triers} tried</span></li>`).join('')}</ul></div>
      </div></section>`;

    const beta = grid.filter(g => g.cells[0].project).map(g => ({r:g.r, who: P.filter((p,pi) => pi > 0 && g.cells[pi].sentEverByEnd).map(p => p.name)})).filter(b => b.who.length);
    const betaHtml = `<section class="panel"><h3>Beta opportunities</h3>
      ${beta.length ? `<ul class="plain">${beta.map(b => `<li><span>${rlab(b.r)} <span class="muted">${esc(b.r.location)}</span></span><span>${b.who.map(esc).join(', ')}</span></li>`).join('')}</ul>`
        : `<p class="muted">None of your current projects have been sent by anyone else yet.</p>`}</section>`;

    const allMax = Math.max(1, ...P.map(p => Math.max(0, ...GRADES.map(g => routes.filter(r => r.grade === g && info(p.log, r.id, V).sent).length))));
    const sideHtml = `<section class="panel"><h3>Side-by-side pyramids</h3>
      <div class="mini">${P.map(p => `<div><h4>${personLabel(p)}</h4>${pyramidHtml(routes, p.log, V, allMax)}</div>`).join('')}</div>${legendFS}</section>
      <section class="panel"><h3>Side-by-side completion</h3>
      <div class="scroll"><table class="grid num"><thead><tr><th>Grade</th>${P.map(p => `<th class="r">${personLabel(p)}</th>`).join('')}</tr></thead>
      <tbody>${gradesInSet.map(g => { const inG = grid.filter(x => x.r.grade === g);
        return `<tr><td>${g}</td>${P.map((p,pi) => { const n = inG.filter(x => x.cells[pi].sent).length; return `<td class="r">${n} of ${inG.length}</td>`; }).join('')}</tr>`; }).join('')}
      </tbody></table></div></section>`;

    return modeSwitch + personal + `<h2 class="section-title">Group</h2>` + routeView + groupCompHtml + toughHtml + betaHtml + sideHtml;
  }

  // ---------- render ----------
  function renderTab(){
    return ui.tab === 'routes' ? renderRoutes() : ui.tab === 'stats' ? renderStats() : ui.tab === 'archive' ? renderArchive() : renderFiles();
  }
  function render(){
    document.getElementById('tabs').hidden = !S.name;
    document.getElementById('who').textContent = S.name;
    document.querySelectorAll('#tabs [data-tab]').forEach(b => b.setAttribute('aria-selected', !ui.screen && b.dataset.tab===ui.tab));
    let html = storageOk ? '' : `<div class="warn">This browser isn't letting the app save. Your changes will be lost when you close the page. Private browsing mode is a common cause.</div>`;
    if(!S.name) html += renderWelcome();
    else if(ui.screen && ui.screen.kind === 'route') html += renderRoute(ui.screen.id);
    else if(ui.screen && ui.screen.kind === 'form') html += renderForm();
    else html += renderTab();
    view.innerHTML = html;
  }

  // ---------- form actions ----------
  function syncForm(){
    const f = ui.form; if(!f) return;
    const loc = document.getElementById('locSel'); if(loc && loc.value) f.location = loc.value;
    const pos = document.getElementById('posSel'); if(pos && pos.value) f.pos = pos.value;
    if(f.editor){
      const n = document.getElementById('edName'); if(n) f.editor.name = n.value;
      document.querySelectorAll('[data-shade]').forEach(inp => { f.editor.shades[+inp.dataset.shade] = inp.value; });
    }
  }
  function openForm(id){
    const r = id && S.routes[id];
    if(r) ui.form = {id, grade:r.grade, colour:r.colour, location:r.location, pos:currentPos(id), posTouched:true};
    else {
      const last = ui.last || {};
      const location = last.location && S.locations.includes(last.location) ? last.location : (S.locations[0] || null);
      ui.form = {id:null, grade:last.grade || null, colour:last.colour || null, location, pos:location ? defaultPos(location) : defaultPos(null), posTouched:false};
    }
    ui.screen = {kind:'form'}; setNote(''); render(); window.scrollTo(0,0);
  }
  function saveRoute(another){
    syncForm();
    const f = ui.form;
    if(!f.grade || !f.colour || !f.location){ setNote('Choose a grade, a colour and a location to save the route.', 'err'); render(); return; }
    if(f.id){
      Object.assign(S.routes[f.id], {grade:f.grade, colour:f.colour, location:f.location});
      placeAt(f.id, f.pos);
      save(); ui.screen = {kind:'route', id:f.id}; setNote(`Route updated. It is now #${numOf(f.id)}.`, 'good'); render(); return;
    }
    const id = rid();
    S.routes[id] = {id, grade:f.grade, colour:f.colour, location:f.location, addedOn:today(), archived:false};
    placeAt(id, f.pos);
    save(); askPersist();
    ui.last = {grade:f.grade, colour:f.colour, location:f.location};
    if(another){
      ui.form = {id:null, grade:f.grade, colour:f.colour, location:f.location, pos:'after:'+id, posTouched:false};
      setNote(`Added #${numOf(id)} ${f.colour} ${f.grade} at ${f.location}. The next route goes straight after it.`, 'good'); render();
    } else {
      ui.screen = null; ui.tab = 'routes'; setNote(''); render();
    }
  }
  function saveColour(){
    syncForm();
    const f = ui.form, ed = f.editor;
    const shades = ed.shades.filter(isHex).slice(0, MAX_SHADES);
    if(!shades.length) return;
    if(ed.mode === 'new'){
      const name = (ed.name || '').trim().slice(0,30);
      if(!name){ setNote('Give the new colour a name.', 'err'); render(); return; }
      if(colourObj(name)){ setNote(`There's already a colour called ${colourObj(name).name}. Choose it, or use a different name.`, 'err'); render(); return; }
      S.colours.push({name, shades});
      f.colour = name; setNote(`${name} added.`, 'good');
    } else {
      const c = colourObj(ed.name); if(c) c.shades = shades;
      setNote(`Shades for ${ed.name} saved. Routes using it have updated.`, 'good');
    }
    f.editor = null; save(); render();
  }

  // ---------- events ----------
  function currentRouteId(){ return ui.screen && ui.screen.kind === 'route' ? ui.screen.id : null; }

  document.addEventListener('click', async e => {
    const t = e.target.closest('button'); if(!t) return;
    const d = t.dataset, id = currentRouteId();
    if(d.tab){ ui.tab = d.tab; ui.screen = null; ui.armed = null; setNote(''); render(); window.scrollTo(0,0); return; }
    if(d.open){ ui.screen = {kind:'route', id:d.open}; ui.date = today(); setNote(''); render(); window.scrollTo(0,0); return; }
    if(d.smode){ ui.stats.mode = d.smode; render(); return; }
    if(d.preset){ ui.stats.preset = d.preset; render(); return; }
    if(d.grade){ syncForm(); ui.form.grade = d.grade; render(); return; }
    if(d.colour){ syncForm(); ui.form.colour = d.colour; render(); return; }
    if(d.rmshade !== undefined){ syncForm(); ui.form.editor.shades.splice(+d.rmshade, 1); render(); return; }
    if(d.pick){ ui.date = d.pick; setNote(''); render(); window.scrollTo(0,0); return; }
    if(d.delvisit){
      if(ui.armed === 'dv:'+d.delvisit){ ui.armed = null; setEntry(id, d.delvisit, 0, false); setNote('Visit deleted.', 'good'); render(); }
      else arm('dv:'+d.delvisit);
      return;
    }
    if(d.rmother){
      if(ui.armed === 'ro:'+d.rmother){ ui.armed = null; delete S.others[d.rmother]; save(); render(); } else arm('ro:'+d.rmother);
      return;
    }
    switch(d.act){
      case 'setName': {
        const v = document.getElementById('nameInput').value.trim();
        if(!v){ setNote('Enter a name to continue.', 'err'); render(); return; }
        S.name = v.slice(0,40); save(); setNote(''); render(); return;
      }
      case 'renameSelf': {
        const v = document.getElementById('nameEdit').value.trim();
        if(v){ S.name = v.slice(0,40); save(); setNote('Name saved.', 'good'); render(); } return;
      }
      case 'back': ui.screen = (ui.screen?.kind === 'form' && ui.form?.id) ? {kind:'route', id:ui.form.id} : null; ui.armed = null; setNote(''); render(); return;
      case 'newRoute': openForm(null); return;
      case 'editRoute': openForm(id); return;
      case 'newColour': syncForm(); ui.form.editor = {mode:'new', name:'', shades:['#888888']}; setNote(''); render(); document.getElementById('edName')?.focus(); return;
      case 'editColour': { syncForm(); const c = colourObj(ui.form.colour); if(c){ ui.form.editor = {mode:'edit', name:c.name, shades:c.shades.slice()}; setNote(''); render(); } return; }
      case 'addShade': syncForm(); if(ui.form.editor.shades.length < MAX_SHADES) ui.form.editor.shades.push('#888888'); render(); return;
      case 'cancelColour': syncForm(); ui.form.editor = null; render(); return;
      case 'saveColour': saveColour(); return;
      case 'showAddLocation': syncForm(); ui.form.addLocation = true; render(); document.getElementById('newLocation')?.focus(); return;
      case 'addLocation': {
        syncForm();
        const v = document.getElementById('newLocation').value.trim().slice(0,40);
        if(!v) return;
        const existing = S.locations.find(l => l.toLowerCase() === v.toLowerCase());
        if(!existing) S.locations.push(v);
        const f = ui.form;
        f.location = existing || v; f.addLocation = false;
        if(!f.posTouched) f.pos = defaultPos(f.location, f.id);
        save(); setNote(''); render(); return;
      }
      case 'saveRoute': saveRoute(false); return;
      case 'saveAnother': saveRoute(true); return;
      case 'archiveRoute':
        if(ui.armed === 'archive'){
          ui.armed = null; archiveRoute(S.routes[ui.form.id]); save();
          ui.screen = null; ui.tab = 'archive'; setNote(''); render();
        } else { syncForm(); arm('archive'); }
        return;
      case 'plus': case 'minus': {
        const cur = entry(id, ui.date) || {attempts:0, sent:false};
        const n = cur.attempts + (d.act === 'plus' ? 1 : -1);
        setEntry(id, ui.date, n, n > 0 && cur.sent);
        setNote(d.act === 'plus' ? `Attempt ${Math.max(n,0)} logged.` : 'Attempt removed.', 'good'); render(); return;
      }
      case 'export-routes': download(`routes-${today()}.json`, routesFile()); S.lastExport.routes = Date.now(); save(); setNote('Route list exported.', 'good'); render(); return;
      case 'export-results': download(`results-${slug(S.name)}-${today()}.json`, resultsFile()); S.lastExport.results = Date.now(); save(); setNote('Your results were exported.', 'good'); render(); return;
      case 'share-routes': if(await shareFile(`routes-${today()}.json`, routesFile())){ S.lastExport.routes = Date.now(); save(); render(); } return;
      case 'share-results': if(await shareFile(`results-${slug(S.name)}-${today()}.json`, resultsFile())){ S.lastExport.results = Date.now(); save(); render(); } return;
      case 'applyRoutes': applyRoutes(ui.pending); ui.pending = null; render(); return;
      case 'restoreResults': restoreResults(ui.pending); ui.pending = null; render(); return;
      case 'storeOthers': storeOthers(ui.pending); ui.pending = null; render(); return;
      case 'cancelImport': ui.pending = null; setNote('Import cancelled. Nothing was changed.'); render(); return;
    }
  });

  document.addEventListener('change', e => {
    const t = e.target, id = currentRouteId();
    if(t.dataset.filter !== undefined){ ui.filters[t.dataset.filter] = t.value; render(); return; }
    if(t.matches('[data-import]')){ const file = t.files && t.files[0]; if(file) readImport(file); t.value = ''; return; }
    if(t.id === 'locSel'){
      syncForm(); const f = ui.form;
      if(!f.posTouched) f.pos = defaultPos(f.location, f.id);
      render(); return;
    }
    if(t.id === 'posSel'){ syncForm(); ui.form.posTouched = true; render(); return; }
    if(t.id === 'rFrom' || t.id === 'rTo'){
      if(isDate(t.value)) ui.stats[t.id === 'rFrom' ? 'from' : 'to'] = t.value;
      render(); return;
    }
    if(t.id === 'visitDate'){ ui.date = isDate(t.value) ? t.value : today(); setNote(''); render(); return; }
    if(t.id === 'attempts'){
      const cur = entry(id, ui.date) || {sent:false};
      const n = parseInt(t.value, 10) || 0;
      setEntry(id, ui.date, n, n > 0 && cur.sent);
      setNote(n > 0 ? `${plural(n,'attempt')} saved for this visit.` : 'Visit cleared.', 'good'); render(); return;
    }
    if(t.id === 'sent'){
      const cur = entry(id, ui.date) || {attempts:0};
      setEntry(id, ui.date, cur.attempts, t.checked);
      setNote(t.checked ? 'Marked as sent on this visit.' : 'Send removed.', 'good'); render(); return;
    }
  });
  document.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const map = {nameInput:'setName', nameEdit:'renameSelf', newLocation:'addLocation', edName:'saveColour'};
    const act = map[e.target.id]; if(act){ e.preventDefault(); document.querySelector(`[data-act="${act}"]`)?.click(); }
  });

  render();
})();
</script>
</body>
</html>
